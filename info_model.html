<!DOCTYPE html>

<head>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 12px; font-size: 13px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .section-title { font-size: 13px; font-weight: 700; color: #60a5fa; margin: 0 0 10px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .preset-bar { display: flex; gap: 6px; margin-bottom: 10px; }
    select, button { border-radius: 6px; border: 1px solid var(--border); font-size: 12px; padding: 8px 10px; outline: none; }
    select { flex: 1; background: #0f172a; color: var(--text); }
    .btn-primary { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; }
    .btn-primary:active { background: var(--accent-hover); }
    .btn-warn { background: var(--warn); color: #0f172a; border: none; font-weight: 600; cursor: pointer; padding: 4px 8px; font-size: 11px; }
    .field-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 6px; align-items: center; margin-bottom: 7px; }
    .field-label { color: var(--muted); font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .field-input { width: 100%; background: #0f172a; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px; font-size: 12px; font-family: monospace; }
    .btn-copy { background: #334155; color: var(--text); border: none; padding: 6px 9px; border-radius: 5px; cursor: pointer; font-size: 11px; }
    .btn-copy.copied { background: var(--success); color: #fff; }
  </style>
</head>

  <!-- KONTROL UTAMA -->
  <div class="card">
    <div class="section-title">
      <span>Pengaturan Profil & Operator</span>
    </div>
    <div class="preset-bar">
      <select id="devicePreset" onchange="generateAll()">
        <option value="0">Samsung Galaxy A52s 5G (Snapdragon 778G)</option>
        <option value="1">Xiaomi Redmi Note 11 (Snapdragon 680)</option>
        <option value="2">OPPO Reno8 5G (Dimensity 1300)</option>
        <option value="3">Vivo V23 5G (Dimensity 920)</option>
        <option value="4">Realme 9 Pro+ 5G (Dimensity 920)</option>
      </select>
    </div>
    <div class="preset-bar" style="margin-bottom: 0;">
      <select id="simOperator" onchange="generatePhoneParams()">
        <option value="51010">Telkomsel (51010)</option>
        <option value="51011">XL Axiata (51011)</option>
        <option value="51001">Indosat Ooredoo (51001)</option>
        <option value="51089">Tri / 3 (51089)</option>
        <option value="51009">Smartfren (51009)</option>
      </select>
      <button class="btn-primary" onclick="randomAll()">Acak Semua</button>
    </div>
  </div>

  <!-- BAGIAN 1: PARAMETER PONSEL -->
  <div class="card">
    <div class="section-title">
      <span>1. Parameter Ponsel (Identitas Unik)</span>
      <button class="btn-warn" onclick="generatePhoneParams()">Acak Ulang ID</button>
    </div>
    <div id="phoneParamFields"></div>
  </div>

  <!-- BAGIAN 2: INFO MODEL -->
  <div class="card">
    <div class="section-title">
      <span>2. Info Model (Model Ponsel)</span>
    </div>
    <div id="modelFields"></div>
  </div>

  <!-- BAGIAN 3: INFO GPU -->
  <div class="card">
    <div class="section-title">
      <span>3. Info GPU (Model GPU)</span>
    </div>
    <div id="gpuFields"></div>
  </div>
</div>

function randDigits(len, noZeroStart = false) {
  let res = "";
  for (let i = 0; i < len; i++) {
    if (i === 0 && noZeroStart) {
      res += Math.floor(Math.random() * 9) + 1;
    } else {
      res += Math.floor(Math.random() * 10);
    }
  }
  return res;
}

function randHex(len) {
  const chars = "0123456789abcdef";
  let res = "";
  for (let i = 0; i < len; i++) res += chars[Math.floor(Math.random() * 16)];
  return res;
}

function randAlphaNum(len) {
  const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  let res = "";
  for (let i = 0; i < len; i++) res += chars[Math.floor(Math.random() * chars.length)];
  return res;
}

// Perhitungan digit terakhir (Luhn Checksum) untuk IMEI & ICCID
function calcLuhn(numStr) {
  let sum = 0;
  let shouldDouble = true;
  for (let i = numStr.length - 1; i >= 0; i--) {
    let digit = parseInt(numStr.charAt(i), 10);
    if (shouldDouble) {
      digit *= 2;
      if (digit > 9) digit -= 9;
    }
    sum += digit;
    shouldDouble = !shouldDouble;
  }
  return (10 - (sum % 10)) % 10;
}

function generateIMEI(tac) {
  const base14 = tac + randDigits(6);
  return base14 + calcLuhn(base14);
}

function generateICCID(mccmnc) {
  // Format standar: 89 + 62 (Indonesia) + 2 digit operator + 12 digit acak + 1 Luhn = 19/20 digit
  const opCode = mccmnc.substring(3, 5);
  const base18 = "8962" + opCode + randDigits(12);
  return base18 + calcLuhn(base18);
}

function generateMAC(prefixList) {
  const rawPrefix = prefixList[Math.floor(Math.random() * prefixList.length)].replace(/[^0-9A-Fa-f]/g, "");
  const p1 = rawPrefix.substring(0, 2);
  const p2 = rawPrefix.substring(2, 4);
  const p3 = rawPrefix.substring(4, 6);
  const s1 = randHex(2).toUpperCase();
  const s2 = randHex(2).toUpperCase();
  const s3 = randHex(2).toUpperCase();
  return `${p1}:${p2}:${p3}:${s1}:${s2}:${s3}`;
}

function renderFields(containerId, dataObj, prefix) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  Object.entries(dataObj).forEach(([label, val], idx) => {
    const inputId = `${prefix}_${idx}`;
    const row = document.createElement("div");
    row.className = "field-row";
    row.innerHTML = `
      <span class="field-label" title="${label}">${label}:</span>
      <input type="text" class="field-input" id="${inputId}" value="${val}" readonly>
      <button class="btn-copy" onclick="copyVal('${inputId}', this)">Salin</button>
    `;
    container.appendChild(row);
  });
}

function generatePhoneParams() {
  const idx = document.getElementById("devicePreset").value;
  const mccmnc = document.getElementById("simOperator").value;
  const p = presets[idx];
  const msin = randDigits(10, true);

  const phoneParams = {
    "IMEI 1": generateIMEI(p.tac),
    "IMEI 2": generateIMEI(p.tac),
    "Android ID": randHex(16),
    "Serial Number": randAlphaNum(12),
    "MCC + MNC": mccmnc,
    "MSIN (10 Digit)": msin,
    "IMSI (Full 15)": mccmnc + msin,
    "ICCID (SIM)": generateICCID(mccmnc),
    "Wi-Fi MAC": generateMAC(p.macPrefix),
    "Bluetooth MAC": generateMAC(p.macPrefix)
  };

  renderFields("phoneParamFields", phoneParams, "prm");
}

function generateAll() {
  const idx = document.getElementById("devicePreset").value;
  const p = presets[idx];
  renderFields("modelFields", p.modelInfo, "mdl");
  renderFields("gpuFields", p.gpuInfo, "gpu");
  generatePhoneParams();
}

function randomAll() {
  const select = document.getElementById("devicePreset");
  let next = Math.floor(Math.random() * presets.length);
  if (next === parseInt(select.value)) {
    next = (next + 1) % presets.length;
  }
  select.value = next;
  generateAll();
}

function copyVal(inputId, btn) {
  const el = document.getElementById(inputId);
  navigator.clipboard.writeText(el.value);
  const oldText = btn.innerText;
  btn.innerText = "OK!";
  btn.classList.add("copied");
  setTimeout(() => {
    btn.innerText = oldText;
    btn.classList.remove("copied");
  }, 900);
}
