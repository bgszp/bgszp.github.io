<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, get, set, child } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBuNaE700uoAXECmd7hG73wiJK6cY1ttcE",
            authDomain: "panel-smsbower.firebaseapp.com",
            databaseURL: "https://panel-smsbower-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "panel-smsbower",
            storageBucket: "panel-smsbower.firebasestorage.app",
            messagingSenderId: "147643043216",
            appId: "1:147643043216:web:09035ac3f71cb353efb715"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const BOWER_NILAI_KURS = 17815; 
        const BOWER_ALLOWED_PROVIDERS = [2295, 3160, 3309, 3340, 2738, 3435, 3029, 1329, 3406];

        // === DATABASE AWALAN NOMOR (PREFIX) INDONESIA ===
        const PREFIX_OPERATOR = {
            "telkomsel": ["811", "812", "813", "821", "822", "851", "852", "853"],
            "indosat": ["814", "815", "816", "855", "856", "857", "858"],
            "xl": ["817", "818", "819", "859", "877", "878", "831", "832", "833", "838"], // Termasuk Axis
            "three": ["895", "896", "897", "898", "899"],
            "smartfren": ["881", "882", "883", "884", "885", "886", "887", "888", "889"]
        };
        // ================================================

        let bower_daftarOrderan = []; 
        let bower_daftarServerTersedia = []; 
        let bower_produkTerpilihId = null; 
        let bower_namaProdukTerpilih = ""; 
        let bower_hargaProdukTerpilih = 0; 
        let bower_siklusCek = 0;

        const BOWER_WORKER_URL = "https://smsbower.tiktiksatu001.workers.dev"; 

        function bower_formatRupiah(angka) {
            return "Rp " + Math.ceil(angka).toLocaleString("id-ID");
        }

        async function apiSMSBower(endpoint, method = "GET", payload = null) {
            const token = localStorage.getItem("otp_key_smsbower");
            if (!token) throw new Error("API Key belum disetting.");
            let targetUrl = `${BOWER_WORKER_URL}/v1/${endpoint}`;
            if (method === "GET") targetUrl += (targetUrl.includes('?') ? '&' : '?') + `nocache=${Date.now()}`; 
            
            let options = { method: method, headers: { "Authorization": `Bearer ${token.trim()}`, "Content-Type": "application/json" } };
            if (payload && method !== "GET") options.body = JSON.stringify(payload);

            try {
                const res = await fetch(targetUrl, options);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
                return data; 
            } catch (e) { throw new Error(e.message || "Gagal terhubung ke proxy."); }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const savedKey = localStorage.getItem("otp_key_smsbower");
            if(savedKey) {
                document.getElementById("bower_otpKey").value = savedKey;
                document.getElementById("bower_statusKey").innerText = "✅ Token Aktif."; document.getElementById("bower_statusKey").style.color = "#50fa7b";
                window.bower_refreshSemuaDataLive();
            } else window.bower_toggleApiKeyDropdown();

            const orderanLokal = localStorage.getItem("daftar_orderan_smsbower");
            if (orderanLokal) { bower_daftarOrderan = JSON.parse(orderanLokal); bower_renderUILayout(); }

            setInterval(window.bower_mesinWaktuTerpusat, 1000);
            setInterval(window.bower_mesinCekSmsTerpusat, 2000); 
        });

        window.bower_toggleRiwayatDropdown = function() { const w = document.getElementById("bower_wadahRiwayatDropdown"); w.style.display = (w.style.display === "none" || w.style.display === "") ? "block" : "none"; }
        window.bower_toggleApiKeyDropdown = function() { const w = document.getElementById("bower_wadahApiKeyDropdown"); w.style.display = (w.style.display === "none" || w.style.display === "") ? "block" : "none"; }
        window.bower_toggleDropdownList = function() { document.getElementById("bower_containerListDropdown").classList.toggle("active"); }

        window.bower_bersihkanAktif = function() {
            let pindah = false;
            bower_daftarOrderan.forEach(item => { if (item.status === "received") { item.status = "history_received"; pindah = true; } });
            if (pindah) { bower_renderUILayout(); bower_simpanDaftarOrderanKeLokal(); }
            window.bower_refreshSemuaDataLive(); bower_showToast("Dibersihkan!");
        }

        window.bower_muatProdukLayanan = async function(autoOpen = false) {
            try {
                let serviceId = document.getElementById("bower_dropdownLayanan").value;
                let elemNamaSrv = document.getElementById("bower_dropdownLayanan").options[document.getElementById("bower_dropdownLayanan").selectedIndex].text;
                let prefixLayanan = elemNamaSrv.split(' ')[0]; 

                if(autoOpen) document.getElementById("bower_labelServerTerpilih").innerHTML = `Mencari harga...`;
                const resProd = await apiSMSBower(`catalog/products?service=${serviceId}`, 'GET');
                let arrData = resProd.data;
                if (!arrData || arrData.length === 0) throw new Error("Stok kosong.");

                arrData = arrData.filter(item => BOWER_ALLOWED_PROVIDERS.includes(parseInt(item.id)));
                if (arrData.length === 0) throw new Error("Provider pilihan kosong.");

                arrData.sort((a, b) => b.price - a.price); 
                let totalItems = arrData.length;
                
                bower_daftarServerTersedia = arrData.map((item, index) => {
                    let rankCategory = item.rank ? item.rank : 
                                       (index < totalItems * 0.33 ? "Gold" : 
                                       (index < totalItems * 0.66 ? "Silver" : "Bronze"));
                    return { id: item.id, stock: item.available, price: item.price, rank: rankCategory };
                });

                bower_renderDropdownOptions();
                
                if (bower_daftarServerTersedia.length > 0) { 
                    const srv = bower_daftarServerTersedia[0]; 
                    bower_produkTerpilihId = srv.id;
                    bower_namaProdukTerpilih = `${prefixLayanan} (Prov ${srv.id})`;
                    bower_hargaProdukTerpilih = srv.price; 
                    
                    let badgeClass = srv.rank === 'Gold' ? 'badge-gold' : (srv.rank === 'Silver' ? 'badge-silver' : 'badge-bronze');
                    document.getElementById("bower_labelServerTerpilih").innerHTML = `<span class="badge-rank ${badgeClass}">${srv.rank}</span> ${bower_formatRupiah(srv.price * BOWER_NILAI_KURS)} <span style="font-size:11px;">(${srv.stock} stok)</span>`;
                    document.getElementById("bower_btnPesanAksi").disabled = false;
                    if(autoOpen) document.getElementById("bower_containerListDropdown").classList.add("active");
                } 
            } catch (e) {
                document.getElementById("bower_labelServerTerpilih").innerText = e.message || "Stok Kosong";
                document.getElementById("bower_btnPesanAksi").disabled = true; document.getElementById("bower_containerListDropdown").innerHTML = "";
            }
        }

        function bower_renderDropdownOptions() {
            const container = document.getElementById("bower_containerListDropdown");
            if(bower_daftarServerTersedia.length === 0) { container.innerHTML = `<div style="padding: 12px; text-align: center;">Kosong</div>`; return; }
            let html = "";
            bower_daftarServerTersedia.forEach((srv, index) => {
                let sel = (bower_produkTerpilihId === srv.id) ? "selected" : "";
                let badgeClass = srv.rank === 'Gold' ? 'badge-gold' : (srv.rank === 'Silver' ? 'badge-silver' : 'badge-bronze');
                html += `<div class="dropdown-item-row ${sel}" onclick="bower_pilihServerDropdown(${index})">
                            <span><span class="badge-rank ${badgeClass}">${srv.rank}</span> Provider ${srv.id} <span style="font-size:10px; color:#aaa;">(${srv.stock} pcs)</span></span>
                            <span style="color:var(--accent-cyan); font-weight:bold;">${bower_formatRupiah(srv.price * BOWER_NILAI_KURS)}</span>
                        </div>`;
            });
            container.innerHTML = html;
        }

        window.bower_pilihServerDropdown = function(index) {
            let elemNamaSrv = document.getElementById("bower_dropdownLayanan").options[document.getElementById("bower_dropdownLayanan").selectedIndex].text;
            let prefixLayanan = elemNamaSrv.split(' ')[0]; 
            const srv = bower_daftarServerTersedia[index];
            bower_produkTerpilihId = srv.id; 
            bower_namaProdukTerpilih = `${prefixLayanan} (Prov ${srv.id})`;
            bower_hargaProdukTerpilih = srv.price; 
            
            let badgeClass = srv.rank === 'Gold' ? 'badge-gold' : (srv.rank === 'Silver' ? 'badge-silver' : 'badge-bronze');
            document.getElementById("bower_labelServerTerpilih").innerHTML = `<span class="badge-rank ${badgeClass}">${srv.rank}</span> ${bower_formatRupiah(srv.price * BOWER_NILAI_KURS)} <span style="font-size:11px;">(${srv.stock} stok)</span>`;
            document.getElementById("bower_containerListDropdown").classList.remove("active");
            document.getElementById("bower_btnPesanAksi").disabled = false; bower_renderDropdownOptions();
        }

        window.bower_eksekusiBeliTerpilih = async function() {
            const btn = document.getElementById("bower_btnPesanAksi"); 
            const teksAsli = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = `MEMPROSES...`;
            
            try {
                let serviceId = document.getElementById("bower_dropdownLayanan").value;
                let opId = document.getElementById("bower_dropdownOperator").value;
                
                if (serviceId === "ka") {
                    bower_daftarOrderan.forEach(item => {
                        if (item.status === "pending" && item.layanan.includes("Shopee")) {
                            item.status = "cancelled"; apiSMSBower(`orders/cancel`, 'POST', { id: item.order_id }).catch(e=>{});
                        }
                    });
                }

                // Dinaikkan menjadi 8x percobaan agar filter telkomsel lebih maksimal
                let maxRetries = 8; 
                let attempt = 0;
                let finalOrder = null;
                let isRecycled = false;

                while (attempt < maxRetries) {
                    attempt++;
                    if(attempt > 1) btn.innerHTML = `MENCARI BARU... (${attempt}/${maxRetries})`;
                    
                    const responseData = await apiSMSBower('orders/create', 'POST', { 
                        provider_id: bower_produkTerpilihId, 
                        service: serviceId,
                        operator: opId
                    });
                    const createdOrder = responseData.data?.orders?.[0];
                    
                    if (createdOrder) {
                        let phone = createdOrder.phone_number;
                        
                        // 1. FILTER AWALAN NOMOR (PREFIX) SECARA LOKAL
                        if (opId !== "any") {
                            // Ambil 3 digit setelah kode negara (misal dari 62812 jadi 812)
                            let prefix = phone.substring(2, 5); 
                            if (!PREFIX_OPERATOR[opId].includes(prefix)) {
                                btn.innerHTML = `⚠️ BUKAN ${opId.toUpperCase()}! GANTI...`;
                                await apiSMSBower(`orders/cancel`, 'POST', { id: createdOrder.id }).catch(e=>{});
                                await new Promise(r => setTimeout(r, 1500)); // Beri nafas API
                                continue; 
                            }
                        }

                        // 2. CEK DATABASE FIREBASE (NOMOR BEKAS)
                        const dbRef = ref(db);
                        const snapshot = await get(child(dbRef, `blocklist/${phone}`));

                        if (snapshot.exists()) {
                            let data = snapshot.val();
                            let ageHours = (Date.now() - data.timestamp) / (1000 * 60 * 60);

                            if (ageHours < 72) {
                                btn.innerHTML = `⚠️ NOMOR BEKAS! GANTI...`;
                                await apiSMSBower(`orders/cancel`, 'POST', { id: createdOrder.id }).catch(e=>{});
                                await new Promise(r => setTimeout(r, 1500)); 
                                continue; 
                            } else {
                                finalOrder = createdOrder;
                                isRecycled = true;
                                break;
                            }
                        } else {
                            finalOrder = createdOrder;
                            break;
                        }
                    } else {
                        throw new Error("Gagal mendapatkan nomor dari API");
                    }
                }

                if (finalOrder) {
                    bower_daftarOrderan.unshift({ 
                        order_id: finalOrder.id, 
                        phone: finalOrder.phone_number, 
                        layanan: bower_namaProdukTerpilih, 
                        harga: bower_hargaProdukTerpilih, 
                        waktu_dibuat: Date.now(), 
                        status: "pending", 
                        otp: "",
                        is_recycled: isRecycled 
                    });
                    bower_renderUILayout(); bower_simpanDaftarOrderanKeLokal(); window.bower_ambilSaldoLive();
                } else {
                    alert("Gagal: Sistem membatalkan pesanan 8x berturut-turut karena terus mendapat nomor operator lain atau nomor bekas. Provider ini mungkin sedang kehabisan stok Telkomsel.");
                }

            } catch (e) { alert("Gagal order: " + e.message); } finally { btn.disabled = false; btn.innerHTML = teksAsli; }
        }

        window.bower_simpanKonfigurasi = function() {
            const key = document.getElementById("bower_otpKey").value.trim();
            if(!key) return alert("Masukkan Token!");
            localStorage.setItem("otp_key_smsbower", key);
            document.getElementById("bower_statusKey").innerText = "✅ Token Disimpan!";
            window.bower_refreshSemuaDataLive(); window.bower_toggleApiKeyDropdown();
        }

        window.bower_refreshSemuaDataLive = function() { window.bower_ambilSaldoLive(); window.bower_muatProdukLayanan(false); }
        
        window.bower_ambilSaldoLive = async function() {
            try {
                const d = await apiSMSBower('balance', 'GET'); 
                let saldoApi = parseFloat(d.data?.balance || 0);
                document.getElementById("bower_txtSaldoLive").innerText = bower_formatRupiah(saldoApi * BOWER_NILAI_KURS);
            } catch(e) { document.getElementById("bower_txtSaldoLive").innerText = "Error"; }
        }

        window.bower_eksekusiBatalkanServer = async function(index) {
            const item = bower_daftarOrderan[index];
            try { await apiSMSBower(`orders/cancel`, 'POST', { id: item.order_id }); item.status = "cancelled"; bower_renderUILayout(); bower_simpanDaftarOrderanKeLokal(); window.bower_ambilSaldoLive(); bower_showToast("Dibatalkan!"); } catch (e) {}
        }
        
        window.bower_blokirManual = async function(index) {
            const item = bower_daftarOrderan[index];
            if (!confirm(`Blokir nomor ${item.phone} agar tidak muncul lagi selama 3x24 jam? Pesanan akan dibatalkan otomatis.`)) return;
            
            try {
                set(ref(db, 'blocklist/' + item.phone), { timestamp: Date.now() }).catch(err => console.log(err));
                await apiSMSBower(`orders/cancel`, 'POST', { id: item.order_id });
                item.status = "cancelled"; 
                bower_renderUILayout(); 
                bower_simpanDaftarOrderanKeLokal(); 
                window.bower_ambilSaldoLive(); 
                bower_showToast("Nomor Diblokir 3 Hari!"); 
            } catch (e) {
                alert("Gagal memblokir: " + e.message);
            }
        }

        window.bower_eksekusiResend = async function(index) {
            const item = bower_daftarOrderan[index];
            try { await apiSMSBower('orders/resend', 'POST', { id: item.order_id }); bower_showToast("Resend Diminta!"); } catch (e) {}
        }
        window.bower_eksekusiSelesai = async function(index) {
            const item = bower_daftarOrderan[index];
            try { await apiSMSBower(`orders/finish`, 'POST', { id: item.order_id }); item.status = "completed"; bower_renderUILayout(); bower_simpanDaftarOrderanKeLokal(); window.bower_ambilSaldoLive(); bower_showToast("Selesai!"); } catch(err) {}
        }

        window.bower_mesinCekSmsTerpusat = async function() {
            bower_siklusCek++; let sudahCekTerbaru = false;
            for (let index = 0; index < bower_daftarOrderan.length; index++) {
                let i = bower_daftarOrderan[index];
                if (i.status !== "pending" && i.status !== "received" && i.status !== "history_received") continue; 
                let izinkanCek = (i.status === "pending" && !sudahCekTerbaru) ? (sudahCekTerbaru = true) : (bower_siklusCek % 10 === 0);
                if (!izinkanCek) continue;
                try {
                    const d = await apiSMSBower(`orders/${i.order_id}`, 'GET');
                    let stat = d.data?.status; let otpCode = d.data?.otp_code; 
                    if (stat === "COMPLETED") { 
                        i.status = "completed"; if(otpCode) i.otp = otpCode; bower_renderUILayout(); bower_simpanDaftarOrderanKeLokal(); 
                    } else if (stat === "OTP_RECEIVED" || otpCode) {
                        if (i.status === "pending" || i.otp !== otpCode) {
                            i.status = "received"; i.otp = otpCode; 
                            set(ref(db, 'blocklist/' + i.phone), { timestamp: Date.now() }).catch(err => console.log(err));
                            bower_putarSuaraNotifKeras(); bower_munculkanPopupNative(i.phone, i.otp, i.layanan); bower_renderUILayout(); bower_simpanDaftarOrderanKeLokal();
                        }
                    } else if (stat === "CANCELED") { 
                        i.status = "cancelled"; bower_renderUILayout(); bower_simpanDaftarOrderanKeLokal(); window.bower_ambilSaldoLive(); 
                    }
                } catch (e) {}
            }
        }

        function bower_renderUILayout() {
            const containerAktif = document.getElementById("bower_containerListOrder");
            const containerRiwayat = document.getElementById("bower_containerRiwayat");
            let htmlAktif = ""; let htmlRiwayat = ""; let countAktif = 0; let countRiwayat = 0;

            bower_daftarOrderan.forEach((item, index) => {
                let sec = Math.floor((Date.now() - item.waktu_dibuat) / 1000);
                if (item.status === "pending" && sec >= 300) { item.status = "cancelled"; apiSMSBower(`orders/cancel`, 'POST', { id: item.order_id }).catch(e=>{}); }
                if (item.status === "cancelled") return; 

                let d = new Date(item.waktu_dibuat);
                let timeStr = d.toLocaleDateString('id-ID', {day:'2-digit', month:'short'}) + " " + d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});

                let labelWarning = item.is_recycled ? `<span style="color:#ff5555; font-size:9px; border:1px solid #ff5555; padding:2px 4px; border-radius:4px; margin-left:4px;">⚠️ Pernah Dipakai</span>` : "";

                if (item.status === "completed" || item.status === "history_received") {
                    let btnKirimUlang = item.status === "history_received" ? `<div style="margin-top:10px; display:flex; gap:6px;"><button onclick="bower_eksekusiResend(${index})" class="btn-action-half btn-resend">Kirim Ulang</button><button onclick="bower_eksekusiSelesai(${index})" class="btn-action-half btn-selesai">Tutup</button></div>` : "";
                    let teksHargaHistory = item.harga ? bower_formatRupiah(item.harga * BOWER_NILAI_KURS) : '-';
                    htmlRiwayat += `
                    <div class="history-card">
                        <div style="display:flex; justify-content:space-between; font-size:10px; color:#8b8da9; margin-bottom:8px;"><span>${item.layanan} ${labelWarning} • ${teksHargaHistory}</span><span>⏱️ ${timeStr}</span></div>
                        <div class="box-copy-statik"><div><div style="font-size:9px; color:#8b8da9;">Nomor HP:</div><div style="font-size:14px; font-weight:bold; color:#fff; margin-top:2px;">${item.phone}</div></div><button onclick="bower_salinTeksToast('${item.phone}')" class="btn-copy-static"><i class="fa-regular fa-copy"></i> Salin</button></div>
                        <div class="box-copy-statik otp-masuk" style="margin-top:6px;"><div><div style="font-size:9px; color:#50fa7b; font-weight:bold;">Kode OTP:</div><div style="font-size:16px; font-weight:bold; color:#50fa7b; letter-spacing:1px;">${item.otp || '-'}</div></div><button onclick="bower_salinTeksToast('${item.otp}')" class="btn-copy-static btn-green"><i class="fa-regular fa-copy"></i> Salin</button></div>
                        ${btnKirimUlang}
                    </div>`; countRiwayat++; return;
                }

                countAktif++; 
                let sisa = Math.max(0, 300 - sec); 
                let cool = Math.max(0, 120 - sec); 
                let sisaMax = Math.max(0, 1500 - sec); 
                
                if (item.layanan.includes("WhatsApp") || item.layanan.includes("WA")) { cool = 0; }

                let textStat = `⚡ Cek OTP... (${sec}s)`; let colStat = "#ffb86c"; let btnAksi = ""; let kotakOtp = "";
                let labelSalin = countAktif === 1 ? "Salin" : `Salin (Antrian ${countAktif})`; let classSalin = countAktif === 1 ? "btn-copy-static" : "btn-copy-static btn-copy-queue";
                
                let btnBlokirManual = item.status === "pending" ? `<button onclick="bower_blokirManual(${index})" style="background:#ff9800; color:#000; border:none; padding:2px 6px; border-radius:4px; font-size:9px; margin-left:6px; font-weight:bold; cursor:pointer;" title="Blokir 3x24 Jam"><i class="fa-solid fa-ban"></i> Blokir</button>` : "";
                
                let badgeMaxTime = `<span style="background:#25204d; border:1px solid #4a3c8c; color:#e0aaff; padding:2px 5px; border-radius:4px; font-size:9px; margin-left:6px; font-weight:bold;" title="Waktu Maksimal SMSBower"><i class="fa-solid fa-clock"></i> ${Math.floor(sisaMax/60)}m ${(sisaMax%60).toString().padStart(2, '0')}s</span>`;

                if (item.status === "received") { 
                    textStat = `🎉 Menunggu Tindakan (Aktif)`; colStat = "#50fa7b"; 
                    kotakOtp = `<div class="box-copy-statik otp-masuk"><div><div style="font-size:9px; color:#50fa7b; font-weight:bold;">Kode OTP:</div><div style="font-size:18px; font-weight:bold; color:#50fa7b; letter-spacing:1px;">${item.otp}</div></div><button onclick="bower_salinTeksToast('${item.otp}')" class="btn-copy-static btn-green"><i class="fa-regular fa-copy"></i> Salin OTP</button></div>`;
                    btnAksi = `<div style="display:flex; gap: 8px; margin-top: 10px;"><button onclick="bower_eksekusiResend(${index})" class="btn-action-half btn-resend"><i class="fa-solid fa-rotate-right"></i> Kirim Ulang</button><button onclick="bower_eksekusiSelesai(${index})" class="btn-action-half btn-selesai"><i class="fa-solid fa-check-double"></i> Selesai</button></div>`;
                } else if (item.status === "pending") {
                    btnAksi = `<button class="btn-batal" ${cool > 0 ? 'disabled style="background:#444;"' : 'style="background:var(--accent-red);"'} onclick="bower_eksekusiBatalkanServer(${index})">${cool > 0 ? `Tunggu (${cool}s)` : '❌ Batalkan Pesanan'}</button>`;
                }
                
                htmlAktif += `<div class="card-order"><div style="display:flex; justify-content:space-between; font-size:10px; color:#aaa; margin-bottom:5px;"><span style="display:flex; align-items:center;">${item.layanan} ${labelWarning} ${btnBlokirManual} ${badgeMaxTime}</span><span>⏱️ ${Math.floor(sisa/60)}m ${sisa%60}s</span></div><div class="box-copy-statik"><div><div style="font-size:9px; color:#8b8da9;">Nomor HP:</div><div style="font-size:15px; font-weight:bold; color:#fff; margin-top:2px;">${item.phone}</div></div><button onclick="bower_salinTeksToast('${item.phone}')" class="${classSalin}"><i class="fa-regular fa-copy"></i> ${labelSalin}</button></div>${kotakOtp}<div style="font-size:11px; font-weight:600; color:${colStat}; margin-top:6px;">${textStat}</div>${btnAksi}</div>`;
            });

            containerAktif.innerHTML = countAktif > 0 ? htmlAktif : `<div style="text-align: center; padding: 20px 10px; color: #6272a4; font-style: italic; font-size: 11px;">Belum ada pesanan aktif.</div>`;
            containerRiwayat.innerHTML = countRiwayat > 0 ? htmlRiwayat : `<div style="text-align: center; padding: 15px 10px; color: #6272a4; font-style: italic; font-size: 11px;">Belum ada riwayat sukses.</div>`;
            document.getElementById("bower_countRiwayatBadge").innerText = countRiwayat;
        }

        function bower_simpanDaftarOrderanKeLokal() { localStorage.setItem("daftar_orderan_smsbower", JSON.stringify(bower_daftarOrderan)); }
        window.bower_hapusSemuaRiwayatBawah = function() { bower_daftarOrderan = bower_daftarOrderan.filter(i => i.status !== "completed" && i.status !== "history_received"); bower_renderUILayout(); bower_simpanDaftarOrderanKeLokal(); }
        window.bower_mesinWaktuTerpusat = function() { if (bower_daftarOrderan.some(i => i.status === "pending" || i.status === "received")) bower_renderUILayout(); }
        
        window.bower_showToast = function(m) { const t = document.getElementById('bower_toastNotif'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1500); }
        window.bower_salinTeksToast = function(txt) { navigator.clipboard.writeText(txt); bower_showToast("Disalin!"); }

        window.bower_putarSuaraNotifKeras = function() {
            try { 
                const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return;
                const audioCtx = new AudioContext(); let time = audioCtx.currentTime; 
                const sequence = [523.25, 659.25, 783.99, 1046.50]; 
                sequence.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = idx % 2 === 0 ? "sine" : "sawtooth"; let startTime = time + (idx * 0.09);
                    osc.frequency.setValueAtTime(freq, startTime); gain.gain.setValueAtTime(0.4, startTime); gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
                    if (audioCtx.createStereoPanner) { const pan = audioCtx.createStereoPanner(); pan.pan.value = idx < 2 ? -0.5 : 0.5; osc.connect(gain).connect(pan).connect(audioCtx.destination); } else { osc.connect(gain).connect(audioCtx.destination); }
                    osc.start(startTime); osc.stop(startTime + 0.4);
                });
            } catch (e) { console.log(e); }
        }

        window.bower_munculkanPopupNative = function(nomor, otp, layanan) {
            if (window.cordova && cordova.plugins && cordova.plugins.notification && cordova.plugins.notification.local) {
                cordova.plugins.notification.local.schedule({ id: Math.floor(Date.now() / 1000), title: `🎉 OTP MASUK (${layanan})`, text: `KODE OTP: ${otp}  (No: ${nomor})`, foreground: true, vibrate: true, priority: 2, wakeup: true });
            } 
        }
