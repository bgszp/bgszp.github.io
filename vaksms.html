<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vak-SMS ID - API Kustom</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-main: #0b0c16; --bg-card: #121324; --bg-item: #181933; --border-color: #2c2e5c; --accent-cyan: #00ffcc; --accent-purple: #9d4edd; --accent-red: #ff5555; --accent-green: #50fa7b; --text-main: #f8f8f2; --text-sub: #8b8da9; }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border-color); padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin-bottom: 10px; }
        
        .pemicu-dropdown { background: var(--bg-item); border: 1px solid #32356b; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; font-size: 13px; color: #fff; user-select: none; }
        .search-input { width: 100%; padding: 10px; border-radius: 8px; background: #0b0c16; border: 1px solid #3d3463; color: #fff; font-size: 13px; outline: none; margin-bottom: 6px; }
        .search-input:focus { border-color: var(--accent-cyan); }
        .card-order { background: #1a1b35; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-top: 12px; }
        .box-copy-statik { display: flex; justify-content: space-between; align-items: center; background: #131428; padding: 8px 10px; border-radius: 8px; border: 1px solid #222448; margin: 6px 0; }
        .btn-copy-static { background: #25274d; border: 1px solid #3d3f7a; color: var(--accent-cyan); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .btn-batal { background: var(--accent-red); color: white; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-action-half { flex: 1; border: none; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-resend { background: #4a3c8c; color: #fff; }
        .btn-selesai { background: #1d3f31; border: 1px solid #2e6f4e; color: var(--accent-green); }
        .history-card { background: #121324; border: 1px solid #2c2e5c; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; align-items: stretch; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #00ffcc; color: #0f0c1b; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; opacity: 0; z-index: 99; transition: all 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .dropdown-box-wrapper { background: #181933; border: 1px solid #3d3463; border-radius: 14px; padding: 14px; margin-top: 12px; }
        .unified-order-box { display: flex; flex-direction: column; gap: 6px; background: #0b0c16; border: 1px solid #4a3c8c; border-radius: 10px; padding: 8px; }
        .unified-select-op { border: none; background: #121324; color: var(--accent-cyan); font-weight: bold; font-size: 13px; padding: 10px; border-radius: 6px; outline: none; cursor: pointer; width: 100%; }
        .btn-pesan-sekarang { background: linear-gradient(45deg, #6c5ce7, #4834d4); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .form-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px;">
            <h3 style="color: #fff; margin: 0; font-size: 15px; font-weight: 600;">🔵 Vak-SMS ID Panel</h3>
            <div style="background: var(--bg-item); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: bold; color: var(--accent-green);">
                👛 <span id="balanceInfo">$0.00</span>
                <i class="fa-solid fa-rotate ms-1" style="cursor: pointer; color:var(--text-sub);" onclick="cekSaldo()"></i>
            </div>
        </div>

        <!-- API CONFIG -->
        <div style="margin-bottom: 12px;">
            <div class="pemicu-dropdown" onclick="toggleElemen('wadahApiKey')">
                <span>🔑 Konfigurasi Koneksi API</span>
                <span style="font-size: 10px;">▼</span>
            </div>
            <div id="wadahApiKey" style="display: none; background: var(--bg-item); padding: 12px; border-radius: 0 0 10px 10px; border: 1px solid #222448; border-top: none; margin-top: -2px;">
                <label style="font-size: 11px; color: var(--accent-cyan); font-weight: bold; margin-bottom:4px; display:block;">API Key Baru:</label>
                <div style="display: flex; gap: 6px;">
                    <input type="password" id="apiKey" placeholder="Masukkan Key API..." class="search-input" style="margin-bottom:0;">
                    <button style="padding: 8px 12px; background: var(--accent-cyan); color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px;" onclick="saveApiKey()">Simpan</button>
                    <button style="padding: 8px 12px; background: var(--accent-red); color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px;" onclick="hapusApiKey()"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        </div>

        <!-- MAIN LAYOUT (Order) -->
        <div class="dropdown-box-wrapper">
            <label class="form-label">🛒 Setup Layanan API</label>
            <div class="unified-order-box">
                <!-- Pilihan Layanan -->
                <select id="serviceCode" class="unified-select-op" onchange="resetStok()" style="margin-bottom: 6px;">
                    <option value="ka" selected>Layanan: Shopee</option>
                    <option value="wa">Layanan: WhatsApp</option>
                </select>

                <div style="display: flex; gap: 6px;">
                    <!-- Operator -->
                    <select id="operatorCode" class="unified-select-op" style="flex: 1;">
                        <option value="">Operator: Acak</option>
                        <option value="telkomsel">Telkomsel</option>
                        <option value="indosat">Indosat</option>
                        <option value="three">Three</option>
                        <option value="xlAxiata">XL Axiata</option>
                        <option value="axis">Axis</option>
                        <option value="smartfren">Smartfren</option>
                    </select>
                    <button class="btn-copy-static" onclick="cekStok()" id="btnCekStok" style="background:#1d3f31; border-color:#2e6f4e; color:var(--accent-green);">
                        <i class="fa-solid fa-tags"></i> Load Harga
                    </button>
                </div>

                <!-- Pilihan Harga Dinamis -->
                <select id="maxPrice" class="unified-select-op" style="margin-top: 6px; color: #d4af37;">
                    <option value="">(Klik Load Harga Dahulu)</option>
                </select>

            </div>
            <button class="btn-pesan-sekarang" id="btnPesan" onclick="pesanNomor()">
                <i class="fa-solid fa-cloud-arrow-down"></i> ORDER NOMOR
            </button>
        </div>

        <!-- ACTIVE DATA SECTION -->
        <div style="margin-top: 18px; border-top: 2px dashed var(--border-color); padding-top: 12px;" id="wadahAktif" style="display: none;">
            <div style="font-size: 13px; font-weight: bold; color: var(--accent-green); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                <span>📱 Nomor Aktif:</span>
                <span id="activeIdDisp" style="font-size: 10px; color: var(--text-sub);">ID: -</span>
                <input type="hidden" id="activationId">
            </div>
            
            <div class="card-order">
                <div class="box-copy-statik">
                    <div>
                        <div style="font-size:9px; color:#8b8da9;">Nomor HP:</div>
                        <div id="phoneNumber" style="font-size:15px; font-weight:bold; color:#fff; margin-top:2px;">-</div>
                    </div>
                    <button class="btn-copy-static" onclick="salinTeks('phoneNumber')">
                        <i class="fa-regular fa-copy"></i> Salin
                    </button>
                </div>

                <div class="box-copy-statik">
                    <div style="width: 100%;">
                        <div style="font-size:9px; color:#8b8da9;">SMS / OTP:</div>
                        <div id="smsBox" style="font-size:16px; font-weight:bold; color:var(--accent-green); margin-top:2px; word-break: break-all;">Menunggu SMS...</div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div style="display:flex; gap: 8px; margin-top: 10px;">
                    <button class="btn-action-half btn-resend" id="btnSms" onclick="cekSMS()"><i class="fa-solid fa-rotate-right"></i> Cek SMS</button>
                    <button class="btn-action-half btn-selesai" onclick="ubahStatus(6)"><i class="fa-solid fa-check-double"></i> Selesai</button>
                </div>
                <button class="btn-batal mt-2" onclick="ubahStatus(8)"><i class="fa-solid fa-xmark"></i> Batalkan / Refund</button>
            </div>
        </div>
    </div>
    
    <!-- TOAST ELEMENT -->
    <div class="toast" id="toastNotif">Aksi Berhasil! ✨</div>

    <!-- LOGIC SCRIPTS -->
    <script>
        const baseUrl = "https://vak-sms.com/stubs/handler_api.php";

        window.onload = () => {
            const savedKey = localStorage.getItem('vakApiKey');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                cekSaldo();
            }
        };

        function toggleElemen(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === "none" || el.style.display === "") ? "block" : "none";
        }

        function tampilToast(pesan) {
            const t = document.getElementById('toastNotif');
            t.innerText = pesan;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        function salinTeks(idElemen) {
            const teks = document.getElementById(idElemen).innerText;
            if(teks && teks !== "-") {
                navigator.clipboard.writeText(teks);
                tampilToast('Tersalin!');
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('vakApiKey', key);
                tampilToast('API Key Disimpan!');
                cekSaldo();
            }
        }

        function hapusApiKey() {
            localStorage.removeItem('vakApiKey');
            document.getElementById('apiKey').value = '';
            document.getElementById('balanceInfo').innerText = "$0.00";
            tampilToast('API Key Dihapus!');
        }

        function getApiKey() {
            return document.getElementById('apiKey').value.trim();
        }

        function resetStok() {
            document.getElementById('maxPrice').innerHTML = '<option value="">(Klik Load Harga Dahulu)</option>';
        }

        async function fetchApi(params) {
            const key = getApiKey();
            if (!key) throw new Error("API Key kosong!");
            const targetUrl = `${baseUrl}?api_key=${key}&${params}`;
            
            try {
                let res = await fetch(targetUrl);
                if (res.ok) return res;
            } catch(e) {}

            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            for (let proxy of proxies) {
                try {
                    let res = await fetch(proxy);
                    if (res.ok) return res;
                } catch(e) {}
            }
            throw new Error("Gagal terhubung.");
        }

        async function cekSaldo() {
            if (!getApiKey()) return;
            document.getElementById('balanceInfo').innerText = "...";
            try {
                const res = await fetchApi('action=getBalance');
                const text = await res.text();
                if(text.includes("ACCESS_BALANCE")) {
                    document.getElementById('balanceInfo').innerText = "$" + text.split(":")[1];
                } else {
                    document.getElementById('balanceInfo').innerText = "Err";
                }
            } catch (e) {
                document.getElementById('balanceInfo').innerText = "Err";
            }
        }

        // FUNGSI CEK HARGA & STOK
        async function cekStok() {
            if (!getApiKey()) { tampilToast("Masukkan API Key!"); return; }
            
            const service = document.getElementById('serviceCode').value;
            const country = "6"; // Hardcode Indonesia
            const btn = document.getElementById('btnCekStok');
            const priceDropdown = document.getElementById('maxPrice');
            
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i>";
            priceDropdown.innerHTML = '<option value="">Memuat data...</option>';

            const targetUrl = `${baseUrl}/activations/offers?services=${service}&countries=${country}`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            try {
                let res = await fetch(proxyUrl, {
                    method: 'GET',
                    headers: { 'Authorization': getApiKey() }
                });
                
                let data = await res.json();
                priceDropdown.innerHTML = '<option value="">Pilih Harga Target / Acak</option>';

                if(data && data.data && data.data[service] && data.data[service][country]) {
                    let mapData = data.data[service][country].map;
                    let mapKeys = Object.keys(mapData).sort((a,b) => parseFloat(a) - parseFloat(b));
                    
                    for (let price of mapKeys) {
                        let stock = mapData[price];
                        priceDropdown.innerHTML += `<option value="${price}">$${price} (Sisa: ${stock} pc)</option>`;
                    }
                    tampilToast("Harga dimuat!");
                } else {
                    priceDropdown.innerHTML = '<option value="">Stok Habis</option>';
                }
            } catch (e) {
                priceDropdown.innerHTML = '<option value="">Gagal memuat (CORS)</option>';
            } finally {
                btn.innerHTML = "<i class='fa-solid fa-tags'></i> Load Harga";
            }
        }

        // FUNGSI ORDER NOMOR
        async function pesanNomor() {
            if (!getApiKey()) { tampilToast("API Key Kosong!"); return; }
            const service = document.getElementById('serviceCode').value;
            const country = "6";
            const operator = document.getElementById('operatorCode').value;
            const maxPrice = document.getElementById('maxPrice').value;
            
            const btn = document.getElementById('btnPesan');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> MEMPROSES...';
            btn.disabled = true;

            let queryParams = `action=getNumber&service=${service}&country=${country}`;
            if (operator) queryParams += `&operator=${operator}`;
            if (maxPrice) queryParams += `&maxPrice=${maxPrice}`;

            try {
                const res = await fetchApi(queryParams);
                const text = await res.text();

                if(text.includes("ACCESS_NUMBER")) {
                    let parts = text.split(":");
                    document.getElementById('activationId').value = parts[1];
                    document.getElementById('activeIdDisp').innerText = "ID: " + parts[1];
                    document.getElementById('phoneNumber').innerText = parts[2];
                    document.getElementById('smsBox').innerText = "Menunggu SMS...";
                    tampilToast("Berhasil Order!");
                    cekSaldo();
                } else if(text.trim() === "NO_NUMBERS") {
                    alert("Stok kosong untuk kriteria tersebut. Ubah harga/operator.");
                } else if(text.trim() === "NO_BALANCE") {
                    alert("Saldo tidak mencukupi.");
                } else {
                    alert("Gagal order: " + text);
                }
            } catch (e) {
                alert(e.message);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> ORDER NOMOR';
                btn.disabled = false;
            }
        }

        // FUNGSI CEK SMS
        async function cekSMS() {
            const id = document.getElementById('activationId').value;
            if(!id) { tampilToast("Belum order nomor!"); return; }
            
            const btn = document.getElementById('btnSms');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cek...';
            btn.disabled = true;
            
            try {
                const res = await fetchApi(`action=getStatus&id=${id}`);
                const text = await res.text();
                
                if(text.includes("STATUS_OK")) {
                    document.getElementById('smsBox').innerText = text.split(":")[1];
                    tampilToast("SMS Masuk!");
                } else if(text === "STATUS_WAIT_CODE") {
                    document.getElementById('smsBox').innerText = "Masih menunggu SMS...";
                    tampilToast("Belum ada SMS");
                } else {
                    document.getElementById('smsBox').innerText = "Status: " + text;
                }
            } catch (e) {
                tampilToast("Gagal cek SMS.");
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Cek SMS';
                btn.disabled = false;
            }
        }

        // FUNGSI BATAL/SELESAI
        async function ubahStatus(statusCode) {
            const id = document.getElementById('activationId').value;
            if(!id) { tampilToast("Tidak ada aktifitas!"); return; }
            
            try {
                const res = await fetchApi(`action=setStatus&id=${id}&status=${statusCode}`);
                const text = await res.text();
                
                if(text.includes("ACCESS_CANCEL")) {
                    tampilToast("Pesanan Dibatalkan!");
                    resetTampilanAktif();
                    cekSaldo();
                } else if (text.includes("ACCESS_READY")) {
                    tampilToast("Status Selesai!");
                    resetTampilanAktif();
                } else {
                    alert("Gagal: " + text);
                }
            } catch (e) {
                tampilToast("Error sistem.");
            }
        }

        function resetTampilanAktif() {
            document.getElementById('activationId').value = "";
            document.getElementById('activeIdDisp').innerText = "ID: -";
            document.getElementById('phoneNumber').innerText = "-";
            document.getElementById('smsBox').innerText = "Menunggu SMS...";
        }
    </script>
</body>
</html>
