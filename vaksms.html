<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vak-SMS IDN (Shopee & WA)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { background-color: #16213e; border: none; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .form-control, .form-select { background-color: #1a1a2e; border: 1px solid #0f3460; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #1a1a2e; color: #fff; border-color: #e94560; box-shadow: none; }
        .form-control:disabled { background-color: #11111d; color: #6c757d; }
        .text-accent { color: #e94560; }
    </style>
</head>
<body>

<div class="container py-4">
    <h3 class="text-center mb-4 fw-bold">Panel <span class="text-accent">Vak-SMS Khusus ID</span></h3>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Pengaturan API & Saldo -->
            <div class="card p-3">
                <div class="mb-3">
                    <label class="form-label text-accent fw-bold">API Key Vak-SMS</label>
                    <div class="input-group">
                        <input type="password" id="apiKey" class="form-control" placeholder="Masukkan API Key">
                        <button class="btn btn-outline-danger" onclick="hapusApiKey()">Hapus</button>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center p-3 rounded" style="background: #0f3460;">
                    <h5 class="m-0">Saldo: <span id="balanceInfo" class="text-success fw-bold">$0.00</span></h5>
                    <button class="btn btn-sm btn-light" onclick="cekSaldo()">Refresh</button>
                </div>
            </div>

            <!-- Form Pemesanan -->
            <div class="card p-3">
                <div class="mb-3">
                    <label class="form-label">Pilih Layanan</label>
                    <select id="serviceCode" class="form-select fw-bold">
                        <option value="ka">Shopee</option>
                        <option value="wa">WhatsApp</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Negara</label>
                    <input type="text" class="form-control fw-bold" value="Indonesia" disabled>
                    <input type="hidden" id="countryCode" value="6">
                </div>

                <button class="btn btn-primary w-100 fw-bold mb-4" onclick="pesanNomor()" id="btnPesan" style="background-color: #e94560; border:none;">Order Nomor</button>
                
                <hr class="border-secondary mb-4">

                <!-- Output Hasil -->
                <div class="mb-2">
                    <label class="form-label">ID Aktivasi</label>
                    <input type="text" id="activationId" class="form-control text-center text-muted" readonly placeholder="-">
                </div>
                <div class="mb-2">
                    <label class="form-label text-accent fw-bold">Nomor HP</label>
                    <input type="text" id="phoneNumber" class="form-control text-center fs-4 fw-bold text-success" readonly placeholder="-">
                </div>
                <div class="mb-4">
                    <label class="form-label text-warning fw-bold">SMS / OTP</label>
                    <textarea id="smsBox" class="form-control text-center fs-5 fw-bold" rows="2" readonly placeholder="Belum ada SMS"></textarea>
                </div>

                <!-- Kontrol -->
                <div class="d-flex gap-2">
                    <button class="btn btn-success flex-fill fw-bold" onclick="cekSMS()" id="btnSms">Cek SMS</button>
                    <button class="btn btn-danger flex-fill fw-bold" onclick="ubahStatus(8)">Batal</button>
                    <button class="btn btn-info flex-fill fw-bold text-white" onclick="ubahStatus(6)">Selesai</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const baseUrl = "https://vak-sms.com/stubs/handler_api.php";

    window.onload = () => {
        const savedKey = localStorage.getItem('vakApiKey');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            cekSaldo();
        }
    };

    function getApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) localStorage.setItem('vakApiKey', key);
        return key;
    }

    function hapusApiKey() {
        localStorage.removeItem('vakApiKey');
        document.getElementById('apiKey').value = '';
        document.getElementById('balanceInfo').innerText = "$0.00";
    }

    // Proxy publik untuk membypass blokir CORS di HP/Browser lokal
    // Jika tidak mau pakai proxy, hapus 'https://api.allorigins.win/raw?url='
    async function fetchApi(params) {
        const key = getApiKey();
        if (!key) throw new Error("API Key kosong!");
        const targetUrl = encodeURIComponent(`${baseUrl}?api_key=${key}&${params}`);
        const proxyUrl = `https://api.allorigins.win/raw?url=${targetUrl}`;
        
        let res = await fetch(proxyUrl);
        if (!res.ok) throw new Error("Network response was not ok");
        return res;
    }

    async function cekSaldo() {
        if (!getApiKey()) return alert("Masukkan API Key terlebih dahulu!");
        document.getElementById('balanceInfo').innerText = "...";
        try {
            const res = await fetchApi('action=getBalance');
            const text = await res.text();
            if(text.includes("ACCESS_BALANCE")) document.getElementById('balanceInfo').innerText = "$" + text.split(":")[1];
            else document.getElementById('balanceInfo').innerText = text;
        } catch (e) {
            document.getElementById('balanceInfo').innerText = "Gagal koneksi";
        }
    }

    async function pesanNomor() {
        if (!getApiKey()) return alert("Masukkan API Key!");
        const service = document.getElementById('serviceCode').value;
        const country = document.getElementById('countryCode').value;
        
        const btn = document.getElementById('btnPesan');
        btn.innerText = "Memproses...";
        btn.disabled = true;

        try {
            const res = await fetchApi(`action=getNumberV2&service=${service}&country=${country}`);
            const data = await res.json();
            
            if(data.activationId) {
                document.getElementById('activationId').value = data.activationId;
                document.getElementById('phoneNumber').value = data.phoneNumber;
                document.getElementById('smsBox').value = "Menunggu SMS...";
                cekSaldo();
            } else {
                alert("Gagal order. Respons API: " + JSON.stringify(data));
            }
        } catch (e) {
            alert("Error: Gagal memproses order. Pastikan API key benar dan koneksi stabil.");
        } finally {
            btn.innerText = "Order Nomor";
            btn.disabled = false;
        }
    }

    async function cekSMS() {
        const id = document.getElementById('activationId').value;
        if(!id) return alert("Belum ada nomor yang aktif!");
        
        const btn = document.getElementById('btnSms');
        btn.innerText = "Mengecek...";
        
        try {
            const res = await fetchApi(`action=getStatusV2&id=${id}`);
            const data = await res.json();
            if(data.sms && data.sms.code) {
                document.getElementById('smsBox').value = `${data.sms.code} \n(${data.sms.text})`;
            } else {
                document.getElementById('smsBox').value = "Belum ada SMS masuk...";
            }
        } catch (e) {
            alert("Gagal mengecek SMS.");
        } finally {
            btn.innerText = "Cek SMS";
        }
    }

    async function ubahStatus(statusCode) {
        const id = document.getElementById('activationId').value;
        if(!id) return alert("Belum ada ID aktif!");
        
        try {
            const res = await fetchApi(`action=setStatus&id=${id}&status=${statusCode}`);
            const text = await res.text();
            
            if(text.includes("ACCESS_CANCEL")) {
                alert("Pesanan Dibatalkan.");
                document.getElementById('activationId').value = "";
                document.getElementById('phoneNumber').value = "";
                document.getElementById('smsBox').value = "";
                cekSaldo();
            } else if (text.includes("ACCESS_READY")) {
                alert("Status diubah ke Selesai.");
            } else {
                alert("Gagal mengubah status: " + text);
            }
        } catch (e) {
            alert("Error mengubah status.");
        }
    }
</script>
</body>
</html>
