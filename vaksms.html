<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vak-SMS ID - API Kustom</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-main: #0b0c16; --bg-card: #121324; --bg-item: #181933; --border-color: #2c2e5c; --accent-cyan: #00ffcc; --accent-purple: #9d4edd; --accent-red: #ff5555; --accent-green: #50fa7b; --accent-orange: #ff9800; --text-main: #f8f8f2; --text-sub: #8b8da9; }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border-color); padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin-bottom: 10px; }
        
        .pemicu-dropdown { background: var(--bg-item); border: 1px solid #32356b; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; font-size: 13px; color: #fff; user-select: none; }
        .search-input { width: 100%; padding: 10px; border-radius: 8px; background: #0b0c16; border: 1px solid #3d3463; color: #fff; font-size: 13px; outline: none; margin-bottom: 6px; }
        .search-input:focus { border-color: var(--accent-cyan); }
        
        /* TOMBOL KECIL (SMSBOWER STYLE) */
        .btn-mini { border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 5px; }
        .btn-mini.selesai { background: #1d3f31; color: var(--accent-green); border: 1px solid #2e6f4e; }
        .btn-mini.batal { background: var(--accent-red); color: white; border: 1px solid #ff2a2a; }
        .btn-mini.ban { background: var(--accent-orange); color: #000; border: 1px solid #cc7a00; }
        .btn-mini.salin { background: #25274d; color: var(--accent-cyan); border: 1px solid #3d3f7a; padding: 5px 10px; }
        
        .dropdown-box-wrapper { background: #181933; border: 1px solid #3d3463; border-radius: 14px; padding: 14px; margin-top: 12px; }
        .unified-order-box { display: flex; flex-direction: column; gap: 6px; background: #0b0c16; border: 1px solid #4a3c8c; border-radius: 10px; padding: 8px; }
        .unified-select-op { border: none; background: #121324; color: var(--accent-cyan); font-weight: bold; font-size: 13px; padding: 10px; border-radius: 6px; outline: none; cursor: pointer; width: 100%; }
        .btn-pesan-sekarang { background: linear-gradient(45deg, #6c5ce7, #4834d4); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #00ffcc; color: #0f0c1b; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; opacity: 0; z-index: 99; transition: all 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .loading-dots:after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 40% { color: var(--accent-green); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .25em 0 0 var(--accent-green), .5em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .25em 0 0 var(--accent-green), .5em 0 0 var(--accent-green); } }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px;">
            <h3 style="color: #fff; margin: 0; font-size: 15px; font-weight: 600;">🔵 Vak-SMS ID Panel</h3>
            <div style="background: var(--bg-item); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: bold; color: var(--accent-green);">
                👛 <span id="balanceInfo">$0.00</span>
                <i class="fa-solid fa-rotate ms-1" style="cursor: pointer; color:var(--text-sub);" onclick="cekSaldo()"></i>
            </div>
        </div>

        <!-- API CONFIG -->
        <div style="margin-bottom: 12px;">
            <div class="pemicu-dropdown" onclick="toggleElemen('wadahApiKey')">
                <span>🔑 Konfigurasi API Vak-SMS</span>
                <span style="font-size: 10px;">▼</span>
            </div>
            <div id="wadahApiKey" style="display: none; background: var(--bg-item); padding: 12px; border-radius: 0 0 10px 10px; border: 1px solid #222448; border-top: none; margin-top: -2px;">
                <div style="display: flex; gap: 6px;">
                    <input type="password" id="apiKey" placeholder="Masukkan Key API..." class="search-input" style="margin-bottom:0;">
                    <button style="padding: 8px 12px; background: var(--accent-cyan); color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px;" onclick="saveApiKey()">Simpan</button>
                    <button style="padding: 8px 12px; background: var(--accent-red); color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px;" onclick="hapusApiKey()"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        </div>

        <!-- MAIN LAYOUT (Order) -->
        <div class="dropdown-box-wrapper">
            <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">🛒 Setup Layanan API</div>
            <div class="unified-order-box">
                <select id="serviceCode" class="unified-select-op" onchange="renderDaftarHarga()" style="margin-bottom: 6px;">
                    <option value="ka" selected>Layanan: Shopee (Indonesia)</option>
                    <option value="wa">Layanan: WhatsApp (Indonesia)</option>
                </select>

                <div style="display: flex; gap: 6px; margin-bottom: 6px;">
                    <select id="operatorCode" class="unified-select-op" style="flex: 1;">
                        <option value="">Operator: Acak</option>
                        <option value="telkomsel">Telkomsel</option>
                        <option value="indosat">Indosat</option>
                        <option value="three">Three</option>
                        <option value="xlAxiata">XL Axiata</option>
                        <option value="axis">Axis</option>
                        <option value="smartfren">Smartfren</option>
                    </select>
                </div>

                <select id="maxPrice" class="unified-select-op" style="color: #d4af37;"></select>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <span id="infoStokTxt" style="font-size: 11px; color: var(--text-sub);">Info: Cek status stok saat ini</span>
                <button class="btn-mini salin" onclick="cekStokTotal()" id="btnCekStok" style="background:#181933; border: 1px solid #3d3463;">
                    <i class="fa-solid fa-box"></i> Cek Stok Total
                </button>
            </div>

            <button class="btn-pesan-sekarang" id="btnPesan" onclick="pesanNomor()">
                <i class="fa-solid fa-cloud-arrow-down"></i> ORDER NOMOR
            </button>
        </div>

        <!-- ACTIVE DATA SECTION (SMSBOWER STYLE) -->
        <div style="margin-top: 18px; display: none;" id="wadahAktif">
            <div style="font-size: 13px; font-weight: bold; color: var(--accent-green); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                <span>📱 Nomor Aktif:</span>
                <span id="activeIdDisp" style="font-size: 10px; color: var(--text-sub);">ID: -</span>
                <input type="hidden" id="activationId">
            </div>
            
            <div style="background: #1a1b35; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px;">
                
                <!-- BARIS ATAS: Waktu & Tombol Aksi -->
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #3d3f7a; padding-bottom: 10px; margin-bottom: 10px;">
                    <div style="color: var(--accent-orange); font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 5px;">
                        <i class="fa-regular fa-clock"></i> <span id="timerDisplay">20:00</span>
                    </div>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn-mini selesai" onclick="ubahStatus(6, false)" title="Selesai"><i class="fa-solid fa-check"></i></button>
                        <button class="btn-mini batal" onclick="ubahStatus(8, false)"><i class="fa-solid fa-xmark"></i> Batal</button>
                        <button class="btn-mini ban" onclick="ubahStatus(8, true)"><i class="fa-solid fa-ban"></i> Ban</button>
                    </div>
                </div>

                <!-- BARIS TENGAH: Nomor HP -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div id="phoneNumber" style="font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 1px;">-</div>
                    <button class="btn-mini salin" onclick="salinTeks('phoneNumber')"><i class="fa-regular fa-copy"></i> Salin</button>
                </div>

                <!-- BARIS BAWAH: Kotak OTP -->
                <div style="background: #0b0c16; border: 1px solid #222448; border-radius: 8px; padding: 12px; text-align: center;">
                    <div id="smsBox" style="font-size: 16px; font-weight: bold; color: var(--accent-green); word-break: break-all;">
                        Menunggu pesanan...
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    <!-- TOAST ELEMENT -->
    <div class="toast" id="toastNotif">Aksi Berhasil! ✨</div>

    <!-- LOGIC SCRIPTS -->
    <script>
        const baseUrl = "https://vak-sms.com/stubs/handler_api.php";
        
        // ==========================================
        // MASUKKAN URL CLOUDFLARE WORKER ANDA DI SINI
        const MY_WORKER_URL = "https://vaksms-webhook.tiktiksatu001.workers.dev"; 
        // ==========================================
        
        let autoSmsInterval = null; 
        let countdownTimer = null;

        const priceList = {
            "ka": [ { val: "", text: "🎯 Harga Default / Bebas" }, { val: "0.0100", text: "Target Tier: $0.0100" }, { val: "0.0187", text: "Target Tier: $0.0187" }, { val: "0.0188", text: "Target Tier: $0.0188" }, { val: "0.0200", text: "Target Tier: $0.0200" }, { val: "0.0300", text: "Target Tier: $0.0300" }, { val: "0.0497", text: "Target Tier: $0.0497" }, { val: "0.0559", text: "Target Tier: $0.0559" }, { val: "0.0570", text: "Target Tier: $0.0570" }, { val: "0.4510", text: "Target Tier: $0.4510" }, { val: "0.4698", text: "Target Tier: $0.4698" } ],
            "wa": [ { val: "", text: "🎯 Harga Default / Bebas" }, { val: "0.1000", text: "Target Tier: $0.1000" }, { val: "0.1500", text: "Target Tier: $0.1500" }, { val: "0.2000", text: "Target Tier: $0.2000" } ]
        };

        window.onload = () => {
            renderDaftarHarga();
            const savedKey = localStorage.getItem('vakApiKey');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                cekSaldo();
            }
            pulihkanSesiAktif();
        };

        function pulihkanSesiAktif() {
            const savedActId = localStorage.getItem('vakActiveId');
            const savedNumber = localStorage.getItem('vakActiveNumber');
            const savedEndTime = localStorage.getItem('vakEndTime');
            
            if (savedActId && savedNumber && savedEndTime) {
                document.getElementById('wadahAktif').style.display = "block";
                document.getElementById('activationId').value = savedActId;
                document.getElementById('activeIdDisp').innerText = "ID: " + savedActId;
                document.getElementById('phoneNumber').innerText = savedNumber;
                
                const cachedOtp = localStorage.getItem('vakActiveOtp');
                if(cachedOtp) {
                    document.getElementById('smsBox').innerText = cachedOtp;
                    document.getElementById('smsBox').style.color = "var(--accent-cyan)";
                } else {
                    document.getElementById('smsBox').innerHTML = `<span class="loading-dots" style="color:var(--text-sub); font-size: 13px;">Melanjutkan sinkronisasi</span>`;
                    if(autoSmsInterval) clearInterval(autoSmsInterval);
                    autoSmsInterval = setInterval(otomatisCekSMS, 1500);
                }
                mulaiHitungMundurLokal(parseInt(savedEndTime));
            }
        }

        function toggleElemen(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === "none" || el.style.display === "") ? "block" : "none";
        }

        function tampilToast(pesan) {
            const t = document.getElementById('toastNotif');
            t.innerText = pesan;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function salinTeks(idElemen) {
            const el = document.getElementById(idElemen);
            const teks = el.innerText || el.value;
            if(teks && !teks.includes("Melanjutkan") && teks !== "-") {
                navigator.clipboard.writeText(teks);
                tampilToast('Nomor Tersalin!');
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) { localStorage.setItem('vakApiKey', key); tampilToast('API Key Disimpan!'); cekSaldo(); }
        }

        function hapusApiKey() {
            localStorage.removeItem('vakApiKey');
            document.getElementById('apiKey').value = '';
            document.getElementById('balanceInfo').innerText = "$0.00";
            tampilToast('API Key Dihapus!');
        }

        function getApiKey() { return document.getElementById('apiKey').value.trim(); }

        function renderDaftarHarga() {
            const srv = document.getElementById('serviceCode').value;
            const dropdown = document.getElementById('maxPrice');
            dropdown.innerHTML = "";
            let dataHarga = priceList[srv] || priceList["ka"];
            dataHarga.forEach(h => { dropdown.innerHTML += `<option value="${h.val}">${h.text}</option>`; });
        }

        async function fetchApi(params) {
            const key = getApiKey();
            if (!key) throw new Error("API Key kosong!");
            const targetUrl = `${baseUrl}?api_key=${key}&${params}&nocache=${Date.now()}`;
            
            const urls = [
                targetUrl,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
            ];

            for (let i = 0; i < urls.length; i++) {
                try {
                    const res = await fetch(urls[i]);
                    if (res.ok) return res;
                } catch (e) {
                    if (i === urls.length - 1) throw new Error("Semua koneksi gagal.");
                }
            }
        }

        async function cekSaldo() {
            if (!getApiKey()) return;
            document.getElementById('balanceInfo').innerText = "...";
            try {
                const res = await fetchApi('action=getBalance');
                const text = await res.text();
                if(text.includes("ACCESS_BALANCE")) document.getElementById('balanceInfo').innerText = "$" + text.split(":")[1];
                else document.getElementById('balanceInfo').innerText = "Err";
            } catch (e) { document.getElementById('balanceInfo').innerText = "Err"; }
        }

        async function cekStokTotal() {
            if (!getApiKey()) { tampilToast("Masukkan API Key!"); return; }
            const service = document.getElementById('serviceCode').value;
            const btn = document.getElementById('btnCekStok');
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i>"; btn.disabled = true;

            try {
                let res = await fetchApi(`action=getPrices&service=${service}&country=6`);
                let data = await res.json();
                if(data && data["6"] && data["6"][service]) {
                    document.getElementById('infoStokTxt').innerHTML = `<span style="color:var(--accent-green);">Total: ${data["6"][service].count} | Trmurah: $${data["6"][service].cost}</span>`;
                } else document.getElementById('infoStokTxt').innerHTML = `<span style="color:var(--accent-red);">Stok Kosong!</span>`;
            } catch (e) { document.getElementById('infoStokTxt').innerHTML = "Gagal memuat status."; }
            btn.innerHTML = "<i class='fa-solid fa-box'></i> Cek Stok Total"; btn.disabled = false;
        }

        async function pesanNomor() {
            if (!getApiKey()) { tampilToast("API Key Kosong!"); return; }
            const service = document.getElementById('serviceCode').value;
            const operator = document.getElementById('operatorCode').value;
            const maxPrice = document.getElementById('maxPrice').value;
            const btn = document.getElementById('btnPesan');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> MEMPROSES...'; btn.disabled = true;

            let queryParams = `action=getNumber&service=${service}&country=6`;
            if (operator) queryParams += `&operator=${operator}`;
            if (maxPrice) queryParams += `&maxPrice=${maxPrice}`;

            try {
                const res = await fetchApi(queryParams);
                const text = await res.text();

                if(text.includes("ACCESS_NUMBER")) {
                    let parts = text.split(":");
                    document.getElementById('wadahAktif').style.display = "block";
                    document.getElementById('activationId').value = parts[1];
                    document.getElementById('activeIdDisp').innerText = "ID: " + parts[1];
                    document.getElementById('phoneNumber').innerText = parts[2];
                    document.getElementById('smsBox').innerHTML = `<span class="loading-dots" style="color:var(--accent-green); font-size: 13px;">Otomatis sinkron Webhook</span>`;
                    
                    let endTime = Date.now() + (20 * 60 * 1000); // 20 Menit
                    localStorage.setItem('vakActiveId', parts[1]);
                    localStorage.setItem('vakActiveNumber', parts[2]);
                    localStorage.setItem('vakEndTime', endTime.toString());
                    localStorage.removeItem('vakActiveOtp');

                    mulaiHitungMundurLokal(endTime);
                    tampilToast("Berhasil Order!");
                    cekSaldo();
                    
                    if(autoSmsInterval) clearInterval(autoSmsInterval);
                    autoSmsInterval = setInterval(otomatisCekSMS, 1500);

                } else if(text.trim() === "NO_NUMBERS") alert(`Stok kosong untuk filter tersebut.`);
                else if(text.trim() === "NO_BALANCE") alert("Saldo tidak mencukupi.");
                else alert("Pesan dari Server: " + text);
            } catch (e) { alert("Kesalahan jaringan: " + e.message); } 
            finally { btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> ORDER NOMOR'; btn.disabled = false; }
        }

        function mulaiHitungMundurLokal(endTime) {
            if(countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                let distance = endTime - Date.now();
                if(distance <= 0) {
                    clearInterval(countdownTimer);
                    document.getElementById('timerDisplay').innerText = "00:00";
                    document.getElementById('timerDisplay').style.color = "var(--accent-red)";
                } else {
                    let m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    let s = Math.floor((distance % (1000 * 60)) / 1000);
                    document.getElementById('timerDisplay').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    document.getElementById('timerDisplay').style.color = "var(--accent-orange)";
                }
            }, 1000);
        }

        async function otomatisCekSMS() {
            const id = document.getElementById('activationId').value;
            if(!id) { if(autoSmsInterval) clearInterval(autoSmsInterval); return; }
            try {
                const res = await fetch(`${MY_WORKER_URL}/get-sms?id=${id}&nocache=${Date.now()}`);
                const data = await res.json();
                if(data.status === "OK") {
                    document.getElementById('smsBox').innerText = data.otp;
                    document.getElementById('smsBox').style.color = "var(--accent-cyan)";
                    localStorage.setItem('vakActiveOtp', data.otp);
                    tampilToast("SMS Masuk (Webhook)!");
                    if(autoSmsInterval) clearInterval(autoSmsInterval);
                }
            } catch (e) {} 
        }

        async function ubahStatus(statusCode, isBan) {
            const id = document.getElementById('activationId').value;
            if(!id) { tampilToast("Tidak ada aktifitas!"); return; }
            
            try {
                const key = getApiKey();
                const statusStr = isBan ? 'bad' : 'end'; 
                const targetUrl = `https://vak-sms.com/api/setStatus/?apiKey=${key}&status=${statusStr}&idNum=${id}&nocache=${Date.now()}`;
                
                const urls = [ targetUrl, `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`, `https://corsproxy.io/?${encodeURIComponent(targetUrl)}` ];

                let res;
                for (let i = 0; i < urls.length; i++) {
                    try { res = await fetch(urls[i]); if (res.ok) break; } 
                    catch (e) { if (i === urls.length - 1) throw new Error("Gagal terhubung."); }
                }
                const data = await res.json(); 
                if(data.status) {
                    tampilToast(isBan ? "Nomor Diblokir (Ban)!" : "Pesanan Dibatalkan/Selesai!");
                    resetTampilanAktif(); cekSaldo();
                } else if (data.error) alert("Pesan Server: " + data.error);
            } catch (e) { tampilToast("Error jaringan saat mengubah status."); }
        }

        function resetTampilanAktif() {
            if(autoSmsInterval) clearInterval(autoSmsInterval);
            if(countdownTimer) clearInterval(countdownTimer);
            
            document.getElementById('wadahAktif').style.display = "none";
            document.getElementById('activationId').value = "";
            document.getElementById('activeIdDisp').innerText = "ID: -";
            document.getElementById('phoneNumber').innerText = "-";
            document.getElementById('smsBox').innerHTML = `<span class="loading-dots" style="color:var(--text-sub); font-size: 13px;">Menunggu pesanan...</span>`;
            
            localStorage.removeItem('vakActiveId');
            localStorage.removeItem('vakActiveNumber');
            localStorage.removeItem('vakEndTime');
            localStorage.removeItem('vakActiveOtp');
        }
    </script>
</body>
</html>
