<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vak-SMS Dashboard Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #16213e; border: none; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .card-header { background-color: #0f3460; border-bottom: none; border-radius: 12px 12px 0 0 !important; font-weight: bold; }
        .form-control, .form-select { background-color: #1a1a2e; border: 1px solid #0f3460; color: #fff; }
        .form-control:focus { background-color: #1a1a2e; color: #fff; border-color: #e94560; box-shadow: none; }
        .form-control:read-only { background-color: #11111d; }
        .text-accent { color: #e94560; }
        .table { color: #e0e0e0; font-size: 0.9rem; }
        .table th { border-bottom: 2px solid #0f3460; color: #e94560; }
        .table td { border-bottom: 1px solid #0f3460; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container py-4">
    <h2 class="text-center mb-4 fw-bold">Vak-SMS <span class="text-accent">Panel</span></h2>

    <div class="row">
        <!-- Kolom Kiri: Konfigurasi & Pesan -->
        <div class="col-md-5">
            <div class="card p-3">
                <div class="mb-3">
                    <label class="form-label text-accent fw-bold">API Key</label>
                    <div class="input-group">
                        <input type="password" id="apiKey" class="form-control" placeholder="Masukkan API Key Vak-SMS">
                        <button class="btn btn-outline-danger" onclick="hapusApiKey()">Hapus</button>
                    </div>
                    <small class="text-muted">Disimpan otomatis di browser Anda.</small>
                </div>

                <div class="d-flex justify-content-between align-items-center p-3 rounded" style="background: #0f3460;">
                    <h5 class="m-0">Saldo: <span id="balanceInfo" class="text-success fw-bold">$0.00</span></h5>
                    <button class="btn btn-sm btn-light" onclick="cekSaldo()">Refresh</button>
                </div>
            </div>

            <div class="card p-3">
                <h5 class="text-accent fw-bold mb-3">Pesan Nomor Baru (V2)</h5>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">Service (cth: vk)</label>
                        <input type="text" id="serviceCode" class="form-control" placeholder="vk" value="vk">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Country ID (cth: 2)</label>
                        <input type="number" id="countryCode" class="form-control" placeholder="2" value="2">
                    </div>
                </div>
                <button class="btn btn-primary w-100 fw-bold" onclick="pesanNomor()" id="btnPesan" style="background-color: #e94560; border:none;">Order Nomor</button>
                
                <hr class="border-secondary my-4">

                <div class="mb-2">
                    <label class="form-label">ID Aktivasi Terakhir</label>
                    <input type="text" id="activationId" class="form-control text-center text-muted" readonly placeholder="-">
                </div>
                <div class="mb-2">
                    <label class="form-label text-accent fw-bold">Nomor HP</label>
                    <input type="text" id="phoneNumber" class="form-control text-center fs-5 fw-bold text-success" readonly placeholder="-">
                </div>
                <div class="mb-3">
                    <label class="form-label text-warning fw-bold">SMS / OTP</label>
                    <textarea id="smsBox" class="form-control text-center fs-6 fw-bold" rows="2" readonly placeholder="Belum ada SMS"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-success flex-fill fw-bold" onclick="cekSMS()">Cek SMS</button>
                    <button class="btn btn-danger flex-fill fw-bold" onclick="ubahStatus(8)">Batal</button>
                    <button class="btn btn-info flex-fill fw-bold text-white" onclick="ubahStatus(6)">Selesai</button>
                </div>
            </div>
        </div>

        <!-- Kolom Kanan: Data Riwayat & Aktif -->
        <div class="col-md-7">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Nomor Aktif Saat Ini</span>
                    <button class="btn btn-sm btn-outline-light" onclick="getActive()">Muat Data</button>
                </div>
                <div class="card-body p-0" style="overflow-x: auto;">
                    <table class="table table-borderless table-hover mb-0 text-center">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Layanan</th>
                                <th>Nomor</th>
                                <th>Sisa Waktu</th>
                                <th>Kode SMS</th>
                            </tr>
                        </thead>
                        <tbody id="activeTable">
                            <tr><td colspan="5" class="text-muted">Klik muat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Riwayat Aktivasi (Terakhir)</span>
                    <button class="btn btn-sm btn-outline-light" onclick="getHistory()">Muat Data</button>
                </div>
                <div class="card-body p-0" style="overflow-x: auto; max-height: 300px; overflow-y: auto;">
                    <table class="table table-borderless table-hover mb-0 text-center">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tanggal</th>
                                <th>Nomor</th>
                                <th>SMS</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <tr><td colspan="5" class="text-muted">Klik muat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const baseUrl = "https://vak-sms.com/stubs/handler_api.php";

    // Auto load API Key
    window.onload = () => {
        const savedKey = localStorage.getItem('vakApiKey');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            cekSaldo();
        }
    };

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) localStorage.setItem('vakApiKey', key);
        return key;
    }

    function hapusApiKey() {
        localStorage.removeItem('vakApiKey');
        document.getElementById('apiKey').value = '';
        alert('API Key dihapus dari browser.');
    }

    async function fetchApi(params) {
        const key = saveApiKey();
        if (!key) { alert("API Key kosong!"); throw new Error("No API Key"); }
        try {
            const res = await fetch(`${baseUrl}?api_key=${key}&${params}`);
            return res;
        } catch (e) {
            alert("Koneksi gagal. Periksa ekstensi CORS jika di localhost.");
            throw e;
        }
    }

    async function cekSaldo() {
        document.getElementById('balanceInfo').innerText = "...";
        const res = await fetchApi('action=getBalance');
        const text = await res.text();
        if(text.includes("ACCESS_BALANCE")) document.getElementById('balanceInfo').innerText = "$" + text.split(":")[1];
        else document.getElementById('balanceInfo').innerText = "Error";
    }

    async function pesanNomor() {
        const service = document.getElementById('serviceCode').value;
        const country = document.getElementById('countryCode').value;
        if(!service || !country) return alert("Isi Layanan dan ID Negara!");
        
        document.getElementById('btnPesan').innerText = "Memproses...";
        const res = await fetchApi(`action=getNumberV2&service=${service}&country=${country}`);
        const data = await res.json();
        
        if(data.activationId) {
            document.getElementById('activationId').value = data.activationId;
            document.getElementById('phoneNumber').value = data.phoneNumber;
            document.getElementById('smsBox').value = "Menunggu SMS...";
            getActive(); 
            cekSaldo();
        } else {
            alert("Gagal order: Pastikan saldo/stok ada.");
        }
        document.getElementById('btnPesan').innerText = "Order Nomor";
    }

    async function cekSMS() {
        const id = document.getElementById('activationId').value;
        if(!id) return alert("Tidak ada ID aktif di form!");
        
        const res = await fetchApi(`action=getStatusV2&id=${id}`);
        const data = await res.json();
        if(data.sms && data.sms.code) {
            document.getElementById('smsBox').value = `${data.sms.code} \n(${data.sms.text})`;
        } else {
            document.getElementById('smsBox').value = "Menunggu SMS masuk...";
        }
    }

    async function ubahStatus(statusCode) {
        const id = document.getElementById('activationId').value;
        if(!id) return alert("Pilih pesanan aktif!");
        
        const res = await fetchApi(`action=setStatus&id=${id}&status=${statusCode}`);
        const text = await res.text();
        
        if(text.includes("ACCESS_CANCEL")) {
            alert("Dibatalkan.");
            document.getElementById('activationId').value = "";
            document.getElementById('phoneNumber').value = "";
            document.getElementById('smsBox').value = "";
            getActive(); cekSaldo();
        } else if (text.includes("ACCESS_READY")) {
            alert("Diatur ke siap/selesai.");
        } else alert("Respon: " + text);
    }

    async function getActive() {
        document.getElementById('activeTable').innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
        const res = await fetchApi('action=getActiveActivations');
        const data = await res.json();
        
        if(data.status === "success" && data.data.length > 0) {
            let rows = "";
            data.data.forEach(item => {
                let smsShow = item.smsCode ? `<span class="text-success fw-bold">${item.smsCode}</span>` : 'Menunggu...';
                rows += `<tr>
                    <td><small class="text-muted">${item.activationId}</small></td>
                    <td><span class="badge bg-secondary">${item.serviceCode}</span></td>
                    <td class="text-info">${item.phoneNumber}</td>
                    <td>${item.activationTime.split(" ")[1]}</td>
                    <td>${smsShow}</td>
                </tr>`;
            });
            document.getElementById('activeTable').innerHTML = rows;
        } else {
            document.getElementById('activeTable').innerHTML = '<tr><td colspan="5" class="text-muted">Tidak ada nomor aktif.</td></tr>';
        }
    }

    async function getHistory() {
        document.getElementById('historyTable').innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
        // Ambil 10 data terakhir
        const res = await fetchApi('action=getHistory&size=10'); 
        const text = await res.text();
        
        try {
            const data = JSON.parse(text);
            if(data.length > 0) {
                let rows = "";
                data.forEach(item => {
                    let statusBadge = item.status == "6" ? '<span class="badge bg-success">Sukses</span>' : 
                                      item.status == "8" ? '<span class="badge bg-danger">Batal</span>' : 
                                      `<span class="badge bg-secondary">${item.status}</span>`;
                    
                    rows += `<tr>
                        <td><small class="text-muted">${item.id}</small></td>
                        <td><small>${item.date.split(" ")[0]}</small></td>
                        <td>${item.phone}</td>
                        <td>${item.sms || '-'}</td>
                        <td>${statusBadge}</td>
                    </tr>`;
                });
                document.getElementById('historyTable').innerHTML = rows;
            } else {
                document.getElementById('historyTable').innerHTML = '<tr><td colspan="5" class="text-muted">Belum ada riwayat.</td></tr>';
            }
        } catch (e) {
            document.getElementById('historyTable').innerHTML = `<tr><td colspan="5" class="text-danger">Error memuat data.</td></tr>`;
        }
    }
</script>
</body>
</html>
