<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMSCode.gg Shopee Panel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-main: #0b0c16; --bg-card: #121324; --bg-item: #181933; --border-color: #2c2e5c; --accent-cyan: #00ffcc; --accent-purple: #9d4edd; --accent-red: #ff5555; --accent-green: #50fa7b; --text-main: #f8f8f2; --text-sub: #8b8da9; }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border-color); padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin-bottom: 10px; }
        .pemicu-dropdown { background: var(--bg-item); border: 1px solid #32356b; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; font-size: 13px; color: #fff; user-select: none; }
        .search-input { width: 100%; padding: 10px; border-radius: 8px; background: #0b0c16; border: 1px solid #3d3463; color: #fff; font-size: 13px; outline: none; margin-bottom: 6px; }
        .search-input:focus { border-color: var(--accent-cyan); }
        .card-order { background: #1a1b35; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-top: 12px; }
        .box-copy-statik { display: flex; justify-content: space-between; align-items: center; background: #131428; padding: 8px 10px; border-radius: 8px; border: 1px solid #222448; margin: 6px 0; }
        .box-copy-statik.otp-masuk { background: #152923; border-color: #24523b; }
        
        /* GAYA TOMBOL SALIN (UTAMA VS ANTRIAN) */
        .btn-copy-static { background: #25274d; border: 1px solid #3d3f7a; color: var(--accent-cyan); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .btn-copy-queue { background: #2a1b3d; border: 1px solid #5a2e8c; color: #e0aaff; } 
        .btn-copy-static.btn-green { background: #1d3f31; border-color: #2e6f4e; color: var(--accent-green); }
        
        .btn-batal { color: white; border: none; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-action-half { flex: 1; border: none; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-resend { background: #4a3c8c; color: #fff; }
        .btn-resend:hover { background: #5c4eb5; }
        .btn-selesai { background: #1d3f31; border: 1px solid #2e6f4e; color: var(--accent-green); }
        .btn-selesai:hover { background: #24523b; }

        .history-card { background: #121324; border: 1px solid #2c2e5c; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; align-items: stretch; }
        .history-card .srv-name { font-size: 10px; color: #8b8da9; }
        .history-card .srv-phone { font-size: 13px; font-weight: bold; color: #fff; }
        .history-card .srv-otp { font-size: 14px; font-weight: bold; color: var(--accent-green); background: #152923; padding: 4px 8px; border-radius: 6px; border: 1px solid #24523b; letter-spacing: 1px;}

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #00ffcc; color: #0f0c1b; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; opacity: 0; z-index: 99; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .dropdown-box-wrapper { background: #181933; border: 1px solid #3d3463; border-radius: 14px; padding: 14px; margin-top: 12px; }
        .unified-order-box { display: flex; flex-direction: column; gap: 6px; background: #0b0c16; border: 1px solid #4a3c8c; border-radius: 10px; padding: 8px; }
        .unified-select-op { border: none; background: #121324; color: var(--accent-cyan); font-weight: bold; font-size: 13px; padding: 10px; border-radius: 6px; outline: none; cursor: pointer; width: 100%; }
        .dropdown-selected-bar { background: #121324; border: none; border-radius: 6px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; font-weight: bold; color: #fff; }
        
        .dropdown-list-options { display: none; margin-top: 8px; background: #121324; border: 1px solid #3d3463; border-radius: 10px; max-height: 250px; overflow-y: auto; }
        .dropdown-list-options.active { display: block; }
        .dropdown-item-row { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1b35; cursor: pointer; font-size: 13px; }
        .dropdown-item-row:hover { background: #1e1f3f; }
        .dropdown-item-row.selected { background: #25204d; border-left: 3px solid var(--accent-purple); }
        .btn-pesan-sekarang { background: linear-gradient(45deg, #6c5ce7, #4834d4); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 12px; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-pesan-sekarang:hover { opacity: 0.9; }
        .btn-pesan-sekarang:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }
        .form-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER SALDO -->
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px;">
            <h3 style="color: #fff; margin: 0; font-size: 15px; font-weight: 600;">🔵 Panel Spesialis Shopee ID</h3>
            <div style="background: var(--bg-item); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: bold; color: var(--accent-green);">
                👛 <span id="txtSaldoLive">Rp 0</span>
                <span onclick="refreshSemuaDataLive()" style="cursor: pointer; font-size: 11px; color: var(--accent-cyan); margin-left: 4px;">🔄</span>
            </div>
        </div>

        <!-- SETTING TOKEN -->
        <div style="margin-bottom: 12px;">
            <div class="pemicu-dropdown" onclick="toggleApiKeyDropdown()">
                <span>🔑 Konfigurasi API Key</span>
                <span id="panahApiKey" style="font-size: 10px;">▼</span>
            </div>
            <div id="wadahApiKeyDropdown" style="display: none; background: var(--bg-item); padding: 12px; border-radius: 0 0 10px 10px; border: 1px solid #222448; border-top: none; margin-top: -2px;">
                <label style="font-size: 11px; color: var(--accent-cyan); font-weight: bold; margin-bottom:4px; display:block;">🔑 Bearer Token:</label>
                <div style="display: flex; gap: 6px;">
                    <input type="password" id="otpKeyV5" placeholder="Token API" class="search-input" style="margin-bottom:0;">
                    <button onclick="simpanKonfigurasi()" style="padding: 8px 12px; background: var(--accent-cyan); color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px;">Simpan</button>
                </div>
                <small id="statusKeyV5" style="color: var(--accent-red); font-size: 10px; display: block; margin-top: 6px;">⚠️ Token belum aktif.</small>
            </div>
        </div>

        <!-- AREA PEMESANAN TERPADU -->
        <div class="dropdown-box-wrapper">
            <label class="form-label">🛒 Setup Layanan</label>
            
            <div class="unified-order-box">
                <select id="dropdownOperator" class="unified-select-op" onchange="muatProdukShopee(true)">
                    <option value="">Memuat Operator...</option>
                </select>

                <div class="dropdown-selected-bar" onclick="toggleDropdownList()">
                    <span id="labelServerTerpilih" style="color: #fff;">Pilih Operator Terlebih Dahulu...</span>
                    <span style="font-size: 10px; color: var(--accent-cyan);">▼ Ubah Tier</span>
                </div>
            </div>

            <div id="containerListDropdown" class="dropdown-list-options"></div>

            <button class="btn-pesan-sekarang" id="btnPesanAksi" onclick="eksekusiBeliTerpilih()" disabled>
                <i class="fa-solid fa-cart-shopping"></i> PESAN SEKARANG
            </button>
        </div>

        <!-- NOMOR AKTIF -->
        <div style="margin-top: 18px; border-top: 2px dashed var(--border-color); padding-top: 12px;">
            <div style="font-size: 13px; font-weight: bold; color: var(--accent-green); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                <span>📱 Nomor & OTP Aktif:</span>
                <button onclick="bersihkanAktif()" style="background: var(--accent-red); color: white; border: none; padding: 4px 10px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(255,85,85,0.4);">🧹 Bersihkan</button>
            </div>
            <div id="containerListOrder">
                <div style="text-align: center; padding: 20px 10px; color: #6272a4; font-style: italic; font-size: 12px;">Belum ada pesanan aktif.</div>
            </div>
        </div>

        <!-- RIWAYAT SUKSES (DROPDOWN) -->
        <div style="margin-top: 18px; border-top: 2px dashed var(--border-color); padding-top: 12px;">
            <div class="pemicu-dropdown" onclick="toggleRiwayatDropdown()" style="background: #141529; border-color: #2c2e5c;">
                <span>📜 Riwayat Sukses (<span id="countRiwayatBadge">0</span>)</span>
                <span id="panahRiwayat" style="font-size: 10px;">▼</span>
            </div>
            <div id="wadahRiwayatDropdown" style="display: none; background: #0b0c16; padding: 12px; border-radius: 0 0 10px 10px; border: 1px solid #222448; border-top: none; margin-top: -2px;">
                <div style="text-align: right; margin-bottom: 10px;">
                    <span onclick="hapusSemuaRiwayatBawah()" style="cursor: pointer; font-size: 10px; color: var(--accent-red); background: var(--bg-item); padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); font-weight: bold;">🗑️ Hapus Semua Riwayat</span>
                </div>
                <div id="containerRiwayat">
                    <div style="text-align: center; padding: 15px 10px; color: #6272a4; font-style: italic; font-size: 11px;">Belum ada riwayat sukses.</div>
                </div>
            </div>
        </div>

        <div id="miniConsoleLog" style="margin-top: 12px; padding: 8px; background: var(--bg-main); border-radius: 6px; font-family: monospace; font-size: 10px; color: var(--accent-green); border: 1px solid var(--border-color); word-break: break-all; max-height: 100px; overflow-y: auto;">
            └> Sistem Webhook Diinisialisasi.
        </div>
    </div>
    
    <div class="toast" id="toastNotif">Berhasil! ✨</div>

    <script>
        let daftarOrderan = []; 
        let daftarServerTersedia = [];
        let produkTerpilihId = null;
        let namaProdukTerpilih = "";
        let shopeePlatformId = null; 
        let siklusCek = 0;

        const WORKER_URL = "https://smscode-proxy.tiktiksatu001.workers.dev";

        async function apiSMSCode(endpoint, method = "GET", payload = null) {
            const token = localStorage.getItem("otp_key_smscode");
            if (!token) throw new Error("Bearer Token belum disetting.");

            let targetUrl = `${WORKER_URL}/v1/${endpoint}`;
            if (method === "GET") { 
                targetUrl += (targetUrl.includes('?') ? '&' : '?') + `nocache=${Date.now()}`; 
            }
            
            let headers = { "Authorization": `Bearer ${token.trim()}`, "Content-Type": "application/json", "Accept": "application/json" };
            let options = { method: method, headers: headers };
            if (payload && method !== "GET") options.body = JSON.stringify(payload);

            try {
                const res = await fetch(targetUrl, options);
                const textResponse = await res.text();
                
                let data = {};
                if (textResponse && textResponse.trim() !== "") {
                    try { data = JSON.parse(textResponse); } catch (err) {}
                }
                
                if (!res.ok) {
                    let msg = data.error?.message || data.message || `HTTP ${res.status}`;
                    throw new Error(`[HTTP ${res.status}] ${msg}`);
                }
                return data; 
            } catch (e) { 
                throw new Error(e.message || "Gagal koneksi jaringan ke server proxy.");
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const savedKey = localStorage.getItem("otp_key_smscode");
            if(savedKey) {
                document.getElementById("otpKeyV5").value = savedKey;
                document.getElementById("statusKeyV5").innerText = "✅ Token Aktif.";
                document.getElementById("statusKeyV5").style.color = "#50fa7b";
                refreshSemuaDataLive();
            } else {
                toggleApiKeyDropdown();
            }

            const orderanLokal = localStorage.getItem("daftar_orderan_srv2_shopee");
            if (orderanLokal) { daftarOrderan = JSON.parse(orderanLokal); renderUILayout(); }

            setInterval(mesinWaktuTerpusat, 1000);
            setInterval(mesinCekSmsTerpusat, 2000); 
        });

        function toggleRiwayatDropdown() {
            const w = document.getElementById("wadahRiwayatDropdown");
            const p = document.getElementById("panahRiwayat");
            if (w.style.display === "none" || w.style.display === "") {
                w.style.display = "block";
                p.innerText = "▲";
            } else {
                w.style.display = "none";
                p.innerText = "▼";
            }
        }

        function bersihkanAktif() {
            let pindah = false;
            daftarOrderan.forEach(item => {
                if (item.status === "received") {
                    item.status = "history_received";
                    pindah = true;
                }
            });
            
            if (pindah) { renderUILayout(); simpanDaftarOrderanKeLokal(); }
            refreshSemuaDataLive();
            showToast("Dibersihkan & Katalog Diperbarui!");
            printLog("🧹 Cache UI dibersihkan, me-refresh harga otomatis...");
        }

        async function inisialisasiLayananShopee() {
            try {
                printLog("🔄 Mengambil ID Layanan Shopee...");
                const resSrv = await apiSMSCode('catalog/services?country_id=7', 'GET');
                const shopeeSrv = resSrv.data.find(s => s.name.toLowerCase().includes("shopee"));
                if (!shopeeSrv) throw new Error("Layanan Shopee tidak ditemukan.");
                
                shopeePlatformId = shopeeSrv.id;

                printLog("🔄 Mengambil daftar Operator...");
                const resOp = await apiSMSCode(`catalog/operators?country_id=7&platform_id=${shopeePlatformId}`, 'GET');
                
                let dropdownOp = document.getElementById("dropdownOperator");
                dropdownOp.innerHTML = "";
                
                if(resOp.data.length === 0) {
                    dropdownOp.innerHTML = `<option value="">Tidak ada operator tersedia</option>`;
                } else {
                    resOp.data.forEach(op => {
                        let opt = document.createElement("option");
                        opt.value = op.operator_id === null ? "null" : op.operator_id;
                        opt.text = op.name + (op.code === "any" ? " (Paling Murah)" : "");
                        dropdownOp.appendChild(opt);
                    });
                }
                
                await muatProdukShopee(false);
            } catch (e) {
                printLog(`⚠️ Error Inisialisasi: ${e.message}`);
                document.getElementById("dropdownOperator").innerHTML = `<option value="">Gagal Memuat</option>`;
            }
        }

        async function muatProdukShopee(autoOpen = false) {
            if (!shopeePlatformId) return;
            try {
                if(autoOpen) document.getElementById("labelServerTerpilih").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mencari harga...`;
                
                let opIdRaw = document.getElementById("dropdownOperator").value;
                let queryUrl = `catalog/products?country_id=7&platform_id=${shopeePlatformId}&limit=100`;
                if (opIdRaw && opIdRaw !== "null") queryUrl += `&operator_id=${opIdRaw}`;

                const resProd = await apiSMSCode(queryUrl, 'GET');
                let arrData = resProd.data;
                if (!arrData || arrData.length === 0) throw new Error("Stok tier harga kosong.");

                arrData.sort((a, b) => (a.price || 0) - (b.price || 0));

                daftarServerTersedia = arrData.map(item => ({
                    id: item.id, stock: item.available || 0, price: item.price || 0,
                    name: `Tier (${item.available || 0} stok) — Rp ${(item.price || 0).toLocaleString('id-ID')}`
                }));

                renderDropdownOptions();
                
                if (daftarServerTersedia.length > 0) { 
                    let opText = document.getElementById("dropdownOperator").options[document.getElementById("dropdownOperator").selectedIndex].text;
                    const srv = daftarServerTersedia[0];
                    produkTerpilihId = srv.id;
                    namaProdukTerpilih = `Shopee ${opText} (Rp ${srv.price.toLocaleString('id-ID')})`;
                    document.getElementById("labelServerTerpilih").innerHTML = `Rp ${srv.price.toLocaleString('id-ID')} <span style="color:var(--text-sub); font-size:11px;">(${srv.stock} stok)</span>`;
                    document.getElementById("btnPesanAksi").disabled = false;
                    
                    if(autoOpen) {
                        document.getElementById("containerListDropdown").classList.add("active");
                    } else {
                        document.getElementById("containerListDropdown").classList.remove("active");
                    }
                } 
                else { 
                    document.getElementById("labelServerTerpilih").innerText = "Tidak ada tier tersedia"; 
                    document.getElementById("btnPesanAksi").disabled = true; 
                    document.getElementById("containerListDropdown").classList.remove("active");
                }
            } catch (e) {
                document.getElementById("labelServerTerpilih").innerText = "Stok Kosong / Error";
                document.getElementById("btnPesanAksi").disabled = true;
                document.getElementById("containerListDropdown").innerHTML = "";
                document.getElementById("containerListDropdown").classList.remove("active");
            }
        }

        function renderDropdownOptions() {
            const container = document.getElementById("containerListDropdown");
            if(daftarServerTersedia.length === 0) { container.innerHTML = `<div style="padding: 12px; text-align: center; color: #888; font-size: 12px;">Kosong</div>`; return; }
            let html = "";
            daftarServerTersedia.forEach((srv, index) => {
                let isSelectedClass = (produkTerpilihId === srv.id) ? "selected" : "";
                html += `<div class="dropdown-item-row ${isSelectedClass}" onclick="pilihServerDropdown(${index})"><span>Stok: <span style="color:var(--text-sub); font-size:11px;">(${srv.stock})</span></span><span style="font-weight:bold; color:var(--accent-cyan);">Rp ${srv.price.toLocaleString('id-ID')}</span></div>`;
            });
            container.innerHTML = html;
        }

        function toggleDropdownList() { document.getElementById("containerListDropdown").classList.toggle("active"); }

        function pilihServerDropdown(index) {
            const srv = daftarServerTersedia[index];
            if(!srv) return;
            let opText = document.getElementById("dropdownOperator").options[document.getElementById("dropdownOperator").selectedIndex].text;
            produkTerpilihId = srv.id;
            namaProdukTerpilih = `Shopee ${opText} (Rp ${srv.price.toLocaleString('id-ID')})`;
            document.getElementById("labelServerTerpilih").innerHTML = `Rp ${srv.price.toLocaleString('id-ID')} <span style="color:var(--text-sub); font-size:11px;">(${srv.stock} stok)</span>`;
            document.getElementById("containerListDropdown").classList.remove("active");
            document.getElementById("btnPesanAksi").disabled = false;
            renderDropdownOptions();
        }

        async function eksekusiBeliTerpilih() {
            if (!produkTerpilihId) { alert("Pilih tier harga!"); return; }
            const btn = document.getElementById("btnPesanAksi");
            const teksAsli = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> MEMPROSES...`;

            try {
                const responseData = await apiSMSCode('orders/create', 'POST', { product_id: produkTerpilihId, quantity: 1 });
                const createdOrder = responseData.data?.orders?.[0];
                if (createdOrder && (createdOrder.id || createdOrder.phone_number)) {
                    daftarOrderan.unshift({ order_id: createdOrder.id, phone: createdOrder.phone_number, layanan: namaProdukTerpilih, waktu_dibuat: Date.now(), status: "pending", otp: "" });
                    renderUILayout(); simpanDaftarOrderanKeLokal(); printLog(`🎉 Nomor didapat: ${createdOrder.phone_number}`); ambilSaldoLive();
                } else { throw new Error("Respon ditolak sistem."); }
            } catch (e) { alert("Gagal order:\n" + e.message); } 
            finally { btn.disabled = false; btn.innerHTML = teksAsli; }
        }

        function toggleApiKeyDropdown() {
            const w = document.getElementById("wadahApiKeyDropdown");
            w.style.display = (w.style.display === "none" || w.style.display === "") ? "block" : "none";
        }

        function simpanKonfigurasi() {
            const key = document.getElementById("otpKeyV5").value.trim();
            if(!key) { alert("Masukkan Token!"); return; }
            localStorage.setItem("otp_key_smscode", key);
            document.getElementById("statusKeyV5").innerText = "✅ Token Disimpan!"; document.getElementById("statusKeyV5").style.color = "#50fa7b";
            refreshSemuaDataLive(); toggleApiKeyDropdown();
        }

        function refreshSemuaDataLive() { ambilSaldoLive(); if (!shopeePlatformId) { inisialisasiLayananShopee(); } else { muatProdukShopee(false); } }

        async function ambilSaldoLive() {
            try {
                const d = await apiSMSCode('balance', 'GET'); 
                document.getElementById("txtSaldoLive").innerText = "Rp " + parseInt(d.data?.balance || 0).toLocaleString("id-ID");
            } catch(e) { document.getElementById("txtSaldoLive").innerText = "Error"; }
        }

        async function eksekusiBatalkanServer(index) {
            const item = daftarOrderan[index];
            try {
                await apiSMSCode(`orders/cancel`, 'POST', { id: item.order_id });
                item.status = "cancelled"; renderUILayout(); simpanDaftarOrderanKeLokal(); ambilSaldoLive(); showToast("Dibatalkan!"); 
            } catch (e) { alert("Gagal membatalkan. Tunggu 2 menit."); }
        }

        async function eksekusiResend(index) {
            const item = daftarOrderan[index];
            try {
                showToast("Meminta Resend...");
                const res = await apiSMSCode('orders/resend', 'POST', { id: item.order_id });
                if(res.data && res.data.resent) {
                    showToast("Resend Berhasil Diminta!");
                    printLog(`🔁 Permintaan Resend untuk ${item.phone} terkirim.`);
                } else {
                    showToast("Platform tidak mendukung resend.");
                }
            } catch (e) { alert("Gagal Resend: " + e.message); }
        }

        async function eksekusiSelesai(index) {
            const item = daftarOrderan[index];
            try {
                await apiSMSCode(`orders/finish`, 'POST', { id: item.order_id });
                item.status = "completed"; 
                renderUILayout(); simpanDaftarOrderanKeLokal(); ambilSaldoLive(); 
                showToast("Berhasil Diselesaikan!"); 
                printLog(`✅ Pesanan ${item.phone} diselesaikan sepenuhnya.`);
            } catch(err) { alert("Gagal menyelesaikan: " + err.message); }
        }

        // FUNGSI CEK OTP WEBHOOK DENGAN POLA SMART POLLING KV
        async function mesinCekSmsTerpusat() {
            siklusCek++;
            let sudahCekTerbaru = false;

            for (let index = 0; index < daftarOrderan.length; index++) {
                let i = daftarOrderan[index];
                
                if (i.status !== "pending" && i.status !== "received" && i.status !== "history_received") continue; 
                
                let izinkanCek = false;

                if (i.status === "pending" && !sudahCekTerbaru) {
                    izinkanCek = true;
                    sudahCekTerbaru = true; 
                } 
                else if (siklusCek % 10 === 0) {
                    izinkanCek = true;
                }

                if (!izinkanCek) continue;

                try {
                    // MEMBACA DARI CLOUDFLARE KV (Lebih Cepat dan Aman dari Blokir API)
                    const d = await fetch(`${WORKER_URL}/check-otp?id=${i.order_id}`);
                    const orderData = await d.json(); 
                    if(!orderData) continue;
                    
                    let stat = orderData.status;
                    let otpCode = orderData.otp_code; 

                    if (stat === "COMPLETED") {
                        if (i.status !== "completed") {
                            i.status = "completed"; if(otpCode) i.otp = otpCode;
                            renderUILayout(); simpanDaftarOrderanKeLokal();
                        }
                    } else if (stat === "OTP_RECEIVED" || otpCode) {
                        if (i.status === "pending" || i.otp !== otpCode) {
                            i.status = "received"; i.otp = otpCode; 
                            putarSuaraNotifKeras(); munculkanPopupNative(i.phone, i.otp, i.layanan);
                            renderUILayout(); simpanDaftarOrderanKeLokal(); printLog(`🎉 OTP MASUK (${i.otp})!`);
                        }
                    } else if (stat === "CANCELED" || stat === "CANCELLED" || stat === "EXPIRED" || stat === "REFUNDED") {
                        i.status = "cancelled"; renderUILayout(); simpanDaftarOrderanKeLokal(); ambilSaldoLive();
                    }
                } catch (e) {}
            }
        }

        function renderUILayout() {
            const containerAktif = document.getElementById("containerListOrder");
            const containerRiwayat = document.getElementById("containerRiwayat");
            const badgeRiwayat = document.getElementById("countRiwayatBadge");
            
            let htmlAktif = ""; let htmlRiwayat = "";
            let flagSimpan = false; let countAktif = 0; let countRiwayat = 0;

            daftarOrderan.forEach((item, index) => {
                if (item.status === "cancelled") return; 

                if (item.status === "completed" || item.status === "history_received") {
                    let btnKirimUlang = "";
                    if (item.status === "history_received") {
                        btnKirimUlang = `
                        <div style="margin-top: 10px; display: flex; gap: 6px;">
                            <button onclick="eksekusiResend(${index})" class="btn-action-half btn-resend" style="font-size: 10px;"><i class="fa-solid fa-rotate-right"></i> Kirim Ulang</button>
                            <button onclick="eksekusiSelesai(${index})" class="btn-action-half btn-selesai" style="font-size: 10px;"><i class="fa-solid fa-check-double"></i> Selesai (Tutup)</button>
                        </div>`;
                    }

                    htmlRiwayat += `
                    <div class="history-card">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div class="srv-name">${item.layanan}</div>
                                <div class="srv-phone">${item.phone}</div>
                            </div>
                            <div class="srv-otp">${item.otp || '-'}</div>
                        </div>
                        ${btnKirimUlang}
                    </div>`;
                    countRiwayat++; return;
                }

                // Logika Dinamis: Antrian Pertama = 5 Menit (300 detik), Sisanya = 125 detik
                countAktif++;
                let sec = Math.floor((Date.now() - item.waktu_dibuat) / 1000);
                let batasWaktu = (countAktif === 1) ? 300 : 125;
                let labelBatas = (countAktif === 1) ? "5m" : "125s";
                
                // Trigger Batal Otomatis & Auto Refresh Saldo
                if (item.status === "pending" && sec >= batasWaktu) { 
                    item.status = "cancelled"; 
                    flagSimpan = true; 
                    apiSMSCode(`orders/cancel`, 'POST', { id: item.order_id })
                        .then(() => { ambilSaldoLive(); })
                        .catch(e=>console.log(e));
                    printLog(`⏰ Pesanan ${item.phone} dibatalkan otomatis (${labelBatas}).`);
                    countAktif--; 
                    return; 
                }
                
                let sisa = Math.max(0, batasWaktu - sec); 
                let cool = Math.max(0, 120 - sec); 
                
                let textStat = `⚡ Cek OTP... (${sec}s / ${batasWaktu}s)`; let colStat = "#ffb86c"; let kotakOtp = ""; let btnAksi = "";

                let labelSalin = countAktif === 1 ? "Salin" : `Salin (Antrian ${countAktif})`;
                let classSalin = countAktif === 1 ? "btn-copy-static" : "btn-copy-static btn-copy-queue";

                if (item.status === "received") { 
                    textStat = `🎉 Menunggu Tindakan (Aktif)`; colStat = "#50fa7b"; 
                    kotakOtp = `
                    <div class="box-copy-statik otp-masuk">
                        <div>
                            <div style="font-size:9px; color:#50fa7b; font-weight:bold;">KodeOTP:</div>
                            <div style="font-size:18px; font-weight:bold; color:#50fa7b;">${item.otp}</div>
                        </div>
                        <button onclick="salinTeksToast('${item.otp}')" class="btn-copy-static btn-green"><i class="fa-regular fa-copy"></i> SalinOTP</button>
                    </div>`;
                    btnAksi = `
                    <div style="display:flex; gap: 8px; margin-top: 10px;">
                        <button onclick="eksekusiResend(${index})" class="btn-action-half btn-resend"><i class="fa-solid fa-rotate-right"></i> Kirim Ulang</button>
                        <button onclick="eksekusiSelesai(${index})" class="btn-action-half btn-selesai"><i class="fa-solid fa-check-double"></i> Selesai</button>
                    </div>`;
                } else if (item.status === "pending") {
                    btnAksi = `<button class="btn-batal" ${cool > 0 ? 'disabled style="background:#444;"' : 'style="background:var(--accent-red);"'} onclick="eksekusiBatalkanServer(${index})">${cool > 0 ? `Tunggu (${cool}s)` : '❌ Batalkan Pesanan'}</button>`;
                }
                
                htmlAktif += `
                <div class="card-order">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; font-size:10px; color:#aaa; margin-bottom:5px; gap: 10px;">
                        <span style="flex: 1; word-break: break-word;">${item.layanan}</span>
                        <span style="white-space: nowrap; flex-shrink: 0;">⏱️ Maks: ${labelBatas}</span>
                    </div>
                    
                    <div class="box-copy-statik">
                        <div>
                            <div style="font-size:9px; color:#8b8da9;">Nomor HP:</div>
                            <div style="font-size:15px; font-weight:bold; color:#fff; margin-top:2px; word-break: break-all;">${item.phone}</div>
                        </div>
                        <button onclick="salinTeksToast('${item.phone}')" class="${classSalin}" style="flex-shrink: 0;">
                            <i class="fa-regular fa-copy"></i> ${labelSalin}
                        </button>
                    </div>
                    ${kotakOtp}
                    <div style="font-size:11px; font-weight:600; color:${colStat}; margin-top:6px;">${textStat}</div>
                    ${btnAksi}
                </div>`;
            });

            containerAktif.innerHTML = countAktif > 0 ? htmlAktif : `<div style="text-align: center; padding: 20px 10px; color: #6272a4; font-style: italic; font-size: 12px;">Belum ada pesanan aktif.</div>`;
            containerRiwayat.innerHTML = countRiwayat > 0 ? htmlRiwayat : `<div style="text-align: center; padding: 15px 10px; color: #6272a4; font-style: italic; font-size: 11px;">Belum ada riwayat sukses.</div>`;
            if(badgeRiwayat) badgeRiwayat.innerText = countRiwayat;
            
            if (flagSimpan) simpanDaftarOrderanKeLokal();
        }

        // --- FUNGSI PEMBANTU (HELPERS) ---
        function simpanDaftarOrderanKeLokal() { localStorage.setItem("daftar_orderan_srv2_shopee", JSON.stringify(daftarOrderan)); }
        function hapusSemuaRiwayatBawah() { daftarOrderan = daftarOrderan.filter(i => i.status !== "completed" && i.status !== "history_received"); renderUILayout(); simpanDaftarOrderanKeLokal(); showToast("Riwayat Selesai Dibersihkan!"); }
        function mesinWaktuTerpusat() { if (daftarOrderan.some(i => i.status === "pending")) renderUILayout(); }
        function printLog(t) { const consoleBox = document.getElementById("miniConsoleLog"); consoleBox.innerHTML += `<br>└> ${t}`; consoleBox.scrollTop = consoleBox.scrollHeight; }
        function showToast(m) { const t = document.getElementById('toastNotif'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1500); }
        function salinTeksToast(txt) { navigator.clipboard.writeText(txt); showToast("Disalin!"); }

        function putarSuaraNotifKeras() {
            try { 
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const audioCtx = new AudioContext(); 
                let time = audioCtx.currentTime; 
                
                for (let r = 0; r < 2; r++) { 
                    // Nada Dasar (Pemisahan Stereo Kiri & Kanan Ekstrem)
                    const oscL = audioCtx.createOscillator();
                    const gainL = audioCtx.createGain();
                    oscL.type = "square";
                    oscL.frequency.setValueAtTime(987.77, time); // B5 (kiri)
                    gainL.gain.setValueAtTime(0.3, time);
                    gainL.gain.setTargetAtTime(0, time + 0.1, 0.1);

                    const oscR = audioCtx.createOscillator();
                    const gainR = audioCtx.createGain();
                    oscR.type = "square";
                    oscR.frequency.setValueAtTime(991.00, time); // B5 Sedikit dinaikkan (kanan)
                    gainR.gain.setValueAtTime(0.3, time);
                    gainR.gain.setTargetAtTime(0, time + 0.1, 0.1);

                    // Terapkan Efek Stereo (Jika Peramban Mendukung)
                    if (audioCtx.createStereoPanner) {
                        const panL = audioCtx.createStereoPanner(); panL.pan.value = -1; // Full Kiri
                        const panR = audioCtx.createStereoPanner(); panR.pan.value = 1;  // Full Kanan
                        oscL.connect(gainL).connect(panL).connect(audioCtx.destination);
                        oscR.connect(gainR).connect(panR).connect(audioCtx.destination);
                    } else {
                        oscL.connect(gainL).connect(audioCtx.destination);
                        oscR.connect(gainR).connect(audioCtx.destination);
                    }
                    
                    oscL.start(time); oscL.stop(time + 0.3);
                    oscR.start(time); oscR.stop(time + 0.3);

                    // Melodi Arpeggio Cepat (Di Tengah)
                    const arpFreq = [1318.51, 1567.98, 1975.53]; // E6, G6, B6
                    arpFreq.forEach((f, idx) => {
                        const oscM = audioCtx.createOscillator();
                        const gainM = audioCtx.createGain();
                        oscM.type = "triangle";
                        
                        let tOffset = time + (idx * 0.08);
                        oscM.frequency.setValueAtTime(f, tOffset);
                        
                        gainM.gain.setValueAtTime(0.6, tOffset);
                        gainM.gain.setTargetAtTime(0, tOffset + 0.05, 0.05);
                        
                        oscM.connect(gainM).connect(audioCtx.destination);
                        oscM.start(tOffset);
                        oscM.stop(tOffset + 0.2);
                    });

                    time += 0.45; // Jeda sebelum mengulang lagi
                } 
            } catch (e) { 
                console.log(e); 
            }
        }

        function munculkanPopupNative(nomor, otp, layanan) {
            if (window.cordova && cordova.plugins && cordova.plugins.notification && cordova.plugins.notification.local) {
                cordova.plugins.notification.local.schedule({ id: Math.floor(Date.now() / 1000), title: `🎉 OTP MASUK (${layanan})`, text: `KODE OTP: ${otp}  (No: ${nomor})`, foreground: true, vibrate: true, priority: 2, wakeup: true });
            } 
        }
    </script>
