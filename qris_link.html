<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS Extractor & Shopee Link Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #eee; padding: 20px; max-width: 480px; margin: auto; }
    .card { background: #1e1e1e; padding: 18px; border-radius: 12px; border: 1px solid #333; margin-bottom: 15px; }
    h3 { margin-top: 0; color: #ee4d2d; }
    input[type="file"] { width: 100%; padding: 10px; background: #2a2a2a; border: 1px dashed #555; border-radius: 8px; color: #fff; box-sizing: border-box; cursor: pointer; }
    textarea { width: 100%; height: 75px; background: #111; color: #0f0; border: 1px solid #444; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px; box-sizing: border-box; margin-top: 6px; }
    .btn { display: block; width: 100%; text-align: center; background: #ee4d2d; color: #fff; padding: 11px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; border: none; cursor: pointer; box-sizing: border-box; font-size: 14px; }
    .btn-sec { background: #2d7aee; }
    .label { font-size: 12px; color: #aaa; margin-top: 12px; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h3>⚡ QRIS ke Link & Shopee</h3>
    <label class="label" style="margin-top:0;">Pilih Screenshot QRIS:</label>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="card" id="resultBox" style="display:none;">
    <label class="label" style="margin-top:0;">1. String Asli QRIS (EMVCo Payload):</label>
    <textarea id="rawQris" readonly></textarea>
    <button class="btn btn-sec" onclick="copyText('rawQris')">Salin String QRIS</button>

    <label class="label">2. Link Share QRIS (Bisa Dibuka di Semua Browser):</label>
    <textarea id="shareLink" readonly></textarea>
    <button class="btn btn-sec" onclick="copyText('shareLink')">Salin Link Gambar QR</button>

    <label class="label">3. Deep-Link Pembuka Aplikasi Shopee:</label>
    <a id="shopeeDeepLink" class="btn" href="#">🚀 Buka Aplikasi Shopee</a>
    <a id="webQrLink" class="btn" style="background:#333;" href="#" target="_blank">🔗 Buka Link Gambar QR di Tab Baru</a>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = event => {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);

          if (code && code.data) {
            const payload = code.data;
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('rawQris').value = payload;

            // Buat Link Gambar QRIS instan via API publik
            const qrImageUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=15&data=' + encodeURIComponent(payload);
            document.getElementById('shareLink').value = qrImageUrl;
            document.getElementById('webQrLink').href = qrImageUrl;

            // Buat Deep-Link ke Aplikasi Shopee (Intent Scheme)
            document.getElementById('shopeeDeepLink').href = 'shopeeid://main';
          } else {
            alert('Gagal membaca QR dari gambar. Pastikan gambar QR terlihat jelas.');
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function copyText(id) {
      const el = document.getElementById(id);
      el.select();
      navigator.clipboard.writeText(el.value);
      alert('Berhasil disalin!');
    }
  </script>
</body>
</html>
