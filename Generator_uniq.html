<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Data Generator & Fingerprint</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: transparent; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 4px; 
            margin: 0; 
        }
        .container { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 5px; 
            padding: 5px 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { 
            font-size: 11px; 
            font-weight: 600; 
            color: #58a6ff; 
            margin: 0; 
        }
        .badge {
            font-size: 9px;
            color: #8b949e;
            background: #0d1117;
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid #21262d;
        }
        .action-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }
        input, select { 
            flex: 1;
            width: 100%;
            padding: 4px 6px; 
            border-radius: 4px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #58a6ff; 
            font-size: 11px; 
            text-align: center; 
            font-family: monospace; 
            font-weight: bold;
            outline: none; 
        }
        select {
            font-family: inherit;
            text-align: left;
            color: #c9d1d9;
        }
        button { 
            padding: 4px 8px; 
            background: #238636; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap;
            transition: all 0.2s; 
            min-width: 90px;
        }
        button.btn-secondary {
            background: #30363d;
            min-width: 70px;
        }
        button:active { 
            transform: scale(0.97); 
        }
        button.copied {
            background: #1f6feb !important; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 0. Preset Fingerprint & Display ID -->
        <div class="card">
            <div class="header-row">
                <span class="title">🛡️ Preset Fingerprint (Base A12)</span>
                <span class="badge" id="tacHint">TAC: 86119606</span>
            </div>
            <div class="action-row">
                <select id="deviceSelect" onchange="updateDevicePreset()">
                    <option value="oppo_a6">OPPO A6 (PLS120)</option>
                    <option value="oppo_fx7u">OPPO Find X7 Ultra</option>
                    <option value="oppo_fx8">OPPO Find X8</option>
                    <option value="vivo_neo10">VIVO iQOO Neo10</option>
                    <option value="redmi_k80p">REDMI K80 Pro</option>
                    <option value="honor_m6p">HONOR Magic6 PRO</option>
                    <option value="s21">Galaxy S21 (Valid A12)</option>
                    <option value="s23u">Galaxy S23 Ultra</option>
                </select>
                <button id="btnDisp" class="btn-secondary" onclick="copyPreset('dispOutput', 'btnDisp', 'Salin DispID')">Salin DispID</button>
                <button id="btnFp" onclick="copyPreset('fpOutput', 'btnFp', 'Salin FP')">Salin FP</button>
            </div>
            <input type="hidden" id="dispOutput">
            <input type="hidden" id="fpOutput">
        </div>

        <!-- 1. IMEI Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">⚡ IMEI (Luhn Algo)</span>
                <span class="badge" id="imeiBadge">15 Digit (86119606)</span>
            </div>
            <div class="action-row">
                <input type="text" id="imeiOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnImei" onclick="handleIMEI()">Gen IMEI</button>
            </div>
        </div>

        <!-- 2. MAC Wi-Fi Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">🌐 Alamat MAC (Wi-Fi)</span>
                <span class="badge" id="macWifiBadge">12 Hex (OUI Pabrik)</span>
            </div>
            <div class="action-row">
                <input type="text" id="macOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnMac" onclick="handleMAC('macOutput', 'btnMac', 'Gen MAC WiFi')">Gen MAC WiFi</button>
            </div>
        </div>

        <!-- 3. MAC GSM Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">📡 Alamat MAC GSM</span>
                <span class="badge" id="macGsmBadge">12 Hex (OUI Pabrik)</span>
            </div>
            <div class="action-row">
                <input type="text" id="macGsmOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnMacGsm" onclick="handleMAC('macGsmOutput', 'btnMacGsm', 'Gen MAC GSM')">Gen MAC GSM</button>
            </div>
        </div>

        <!-- 4. MSIN Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">💳 MSIN (ID Kartu SIM)</span>
                <span class="badge">10 Digit Angka</span>
            </div>
            <div class="action-row">
                <input type="text" id="msinOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnMsin" onclick="handleMSIN()">Gen MSIN</button>
            </div>
        </div>

        <!-- 5. Nomor HP Telkomsel Generator (13 Karakter / 12 Digit Lokal) -->
        <div class="card">
            <div class="header-row">
                <span class="title">📱 Nomor HP (Telkomsel)</span>
                <span class="badge">13 Digit (628xx)</span>
            </div>
            <div class="action-row">
                <input type="text" id="phoneOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnPhone" onclick="handlePhone()">Gen No HP</button>
            </div>
        </div>

        <!-- 6. SN Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">🏷️ Serial Number (SN)</span>
                <span class="badge">15 Alfanumerik</span>
            </div>
            <div class="action-row">
                <input type="text" id="snOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnSn" onclick="handleSN()">Gen SN</button>
            </div>
        </div>
    </div>

    <script>
        // Database Preset: TAC 8 Digit Resmi & OUI MAC Pabrikan (Semua digit ke-2 genap/Unicast)
        const devicePresets = {
            oppo_a6: {
                brandName: 'OPPO',
                tac: '86119606',
                oui: ['94d00d', 'bc2def', 'e8bba8', '704d7b', 'a43b00', '1c48ce'],
                disp: 'PLS120_12.0.1.200(CN01)',
                fp: 'OPPO/PLS120/OP5E1C:12/SP1A.210812.016/12.0.1.200:user/release-keys'
            },
            oppo_fx7u: {
                brandName: 'OPPO',
                tac: '86329806',
                oui: ['bc2def', '94d00d', 'e8bba8', '704d7b', '2c598a'],
                disp: 'PHY110_12.0.0.402(CN01)',
                fp: 'OPPO/PHY110/OP5929L1:12/SP1A.210812.016/12.0.0.402:user/release-keys'
            },
            oppo_fx8: {
                brandName: 'OPPO',
                tac: '86741206',
                oui: ['e8bba8', '94d00d', 'bc2def', 'a43b00', '704d7b'],
                disp: 'PKB110_12.0.0.201(CN01)',
                fp: 'OPPO/PKB110/OP5D0BL1:12/SP1A.210812.016/12.0.0.201:user/release-keys'
            },
            vivo_neo10: {
                brandName: 'VIVO',
                tac: '86365805',
                oui: ['549209', 'c8b21e', '7802f8', 'd463c6', 'ac5a14'],
                disp: 'SP1A.210812.003 release-keys',
                fp: 'vivo/PD2425/PD2425:12/SP1A.210812.003/compiler11201512:user/release-keys'
            },
            redmi_k80p: {
                brandName: 'Xiaomi',
                tac: '86483905',
                oui: ['acc1ee', '640980', 'f4f5db', '286c07', '7c1dd9'],
                disp: 'SKQ1.211006.001',
                fp: 'Redmi/champion/champion:12/SKQ1.211006.001/V13.0.12.0.SLKCNXM:user/release-keys'
            },
            honor_m6p: {
                brandName: 'HONOR',
                tac: '86095606',
                oui: ['04f938', '48db50', '80b686', 'e02481', 'c81451'],
                disp: 'BVL-AN16 12.0.0.132(C00E130R2P1)',
                fp: 'HONOR/BVL-AN16/HNBVL:12/HONORBVL-AN16/12.0.0.132C00:user/release-keys'
            },
            s21: {
                brandName: 'Samsung',
                tac: '35876214',
                oui: ['e45e37', 'c0b883', '705a0f', 'd8c4e9', '54b802'],
                disp: 'SP1A.210812.016.G991BXXS5CVH1',
                fp: 'samsung/o1sxeea/o1s:12/SP1A.210812.016/G991BXXS5CVH1:user/release-keys'
            },
            s23u: {
                brandName: 'Samsung',
                tac: '35407985',
                oui: ['d8c4e9', '54b802', 'e45e37', 'c0b883', '244b03'],
                disp: 'SP1A.210812.016.S918BXXU1AWBD',
                fp: 'samsung/dm3qxeea/dm3q:12/SP1A.210812.016/S918BXXU1AWBD:user/release-keys'
            }
        };

        let currentImeiPrefix = '86119606';
        let currentOuiList = devicePresets.oppo_a6.oui;

        function updateDevicePreset() {
            const val = document.getElementById('deviceSelect').value;
            const preset = devicePresets[val];
            document.getElementById('dispOutput').value = preset.disp;
            document.getElementById('fpOutput').value = preset.fp;
            
            currentImeiPrefix = preset.tac;
            currentOuiList = preset.oui;

            document.getElementById('tacHint').innerText = 'TAC: ' + preset.tac;
            document.getElementById('imeiBadge').innerText = '15 Digit (' + preset.tac.substring(0, 2) + ' - ' + preset.brandName + ')';
            document.getElementById('macWifiBadge').innerText = '12 Hex (OUI ' + preset.brandName + ')';
            document.getElementById('macGsmBadge').innerText = '12 Hex (OUI ' + preset.brandName + ')';
        }

        // Inisialisasi awal
        updateDevicePreset();

        function copyTextRaw(text, btnId, originalText) {
            const btnEl = document.getElementById(btnId);
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text);
            } else {
                const tempInput = document.createElement('input');
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
            }
            btnEl.innerText = '✅ Tersalin!';
            btnEl.classList.add('copied');
            setTimeout(() => {
                btnEl.innerText = originalText;
                btnEl.classList.remove('copied');
            }, 900);
        }

        function copyPreset(hiddenId, btnId, originalText) {
            const text = document.getElementById(hiddenId).value;
            copyTextRaw(text, btnId, originalText);
        }

        function copyToClipboard(inputId, btnId, originalText) {
            const val = document.getElementById(inputId).value;
            copyTextRaw(val, btnId, originalText);
        }

        // 1. Fungsi IMEI (Menggunakan 8 digit TAC pabrik + 6 digit acak + 1 Luhn Checksum)
        function handleIMEI() {
            let imei = currentImeiPrefix;
            const remainingLen = 14 - imei.length;
            for (let i = 0; i < remainingLen; i++) {
                imei += Math.floor(Math.random() * 10);
            }
            let sum = 0;
            for (let i = 0; i < 14; i++) {
                let digit = parseInt(imei.charAt(i), 10);
                if (i % 2 !== 0) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
            }
            let checkDigit = (10 - (sum % 10)) % 10;
            imei += checkDigit;
            
            document.getElementById('imeiOutput').value = imei;
            copyToClipboard('imeiOutput', 'btnImei', 'Gen IMEI');
        }

        // 2 & 3. Fungsi MAC Address (Menggunakan 6 karakter OUI Pabrik + Digit ke-2 Pasti Genap/Unicast)
        function handleMAC(inputId, btnId, btnText) {
            const hexChars = '0123456789abcdef';
            const evenHex = '02468ace'; // Wajib genap untuk Unicast IEEE 802

            // Ambil salah satu OUI 6-karakter dari merek HP yang sedang dipilih
            let rawOui = currentOuiList[Math.floor(Math.random() * currentOuiList.length)].toLowerCase();

            // Pastikan karakter ke-2 mutlak genap (validasi pengaman)
            const char1 = rawOui.charAt(0);
            const char2 = evenHex.includes(rawOui.charAt(1)) 
                ? rawOui.charAt(1) 
                : evenHex.charAt(Math.floor(Math.random() * evenHex.length));
            const char3to6 = rawOui.substring(2, 6);

            // Buat 6 karakter hex terakhir secara acak (NIC Specific)
            let nicTail = '';
            for (let i = 0; i < 6; i++) {
                nicTail += hexChars.charAt(Math.floor(Math.random() * 16));
            }

            const mac = char1 + char2 + char3to6 + nicTail;
            document.getElementById(inputId).value = mac;
            copyToClipboard(inputId, btnId, btnText);
        }

        // 4. Fungsi MSIN (10 Digit)
        function handleMSIN() {
            let msin = '' + (Math.floor(Math.random() * 9) + 1);
            for (let i = 0; i < 9; i++) {
                msin += Math.floor(Math.random() * 10);
            }
            document.getElementById('msinOutput').value = msin;
            copyToClipboard('msinOutput', 'btnMsin', 'Gen MSIN');
        }

        // 5. Fungsi Nomor HP Telkomsel (13 Digit dengan 62 = 12 Digit Lokal 08xx)
        function handlePhone() {
            const prefixes = ['62811', '62812', '62813', '62821', '62822', '62823', '62852', '62853'];
            let phone = prefixes[Math.floor(Math.random() * prefixes.length)];
            
            for (let i = 0; i < 8; i++) {
                phone += Math.floor(Math.random() * 10);
            }
            document.getElementById('phoneOutput').value = phone;
            copyToClipboard('phoneOutput', 'btnPhone', 'Gen No HP');
        }

        // 6. Fungsi Serial Number
        function handleSN() {
            let sn = '';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < 15; i++) {
                sn += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('snOutput').value = sn;
            copyToClipboard('snOutput', 'btnSn', 'Gen SN');
        }
    </script>
</body>
</html>
