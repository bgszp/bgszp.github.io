<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Data Generator Compact</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: transparent; /* Transparan agar menyatu dengan background panel utama */
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 8px; 
            margin: 0; 
        }
        .container { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; /* Jarak antar kotak dibuat rapat */
        }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            padding: 10px 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { 
            font-size: 13px; 
            font-weight: 600; 
            color: #58a6ff; 
            margin: 0; 
        }
        .badge {
            font-size: 10px;
            color: #8b949e;
            background: #0d1117;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #21262d;
        }
        .action-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }
        input { 
            flex: 1;
            width: 100%;
            padding: 8px 6px; 
            border-radius: 5px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #58a6ff; 
            font-size: 14px; 
            text-align: center; 
            font-family: monospace; 
            font-weight: bold;
            outline: none; 
            letter-spacing: 0.5px;
        }
        button { 
            padding: 8px 12px; 
            background: #238636; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap;
            transition: all 0.2s; 
            min-width: 115px;
        }
        button:active { 
            transform: scale(0.97); 
        }
        button.copied {
            background: #1f6feb; /* Warna biru saat berhasil disalin */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- IMEI Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">⚡ IMEI (Luhn Algo)</span>
                <span class="badge">15 Digit (86)</span>
            </div>
            <div class="action-row">
                <input type="text" id="imeiOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnImei" onclick="handleIMEI()">Generator IMEI</button>
            </div>
        </div>

        <!-- MAC Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">🌐 MAC Address</span>
                <span class="badge">12 Hex Murni</span>
            </div>
            <div class="action-row">
                <input type="text" id="macOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnMac" onclick="handleMAC()">Generator MAC Ad</button>
            </div>
        </div>

        <!-- SN Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">🏷️ Serial Number (SN)</span>
                <span class="badge">15 Alfanumerik</span>
            </div>
            <div class="action-row">
                <input type="text" id="snOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnSn" onclick="handleSN()">Generator SN</button>
            </div>
        </div>
    </div>

    <script>
        // Fungsi pembantu untuk menyalin teks & mengubah tampilan tombol
        function copyToClipboard(inputId, btnId, originalText) {
            const inputEl = document.getElementById(inputId);
            const btnEl = document.getElementById(btnId);
            
            // Metode salin modern dengan fallback untuk iframe/WebView
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(inputEl.value);
            } else {
                inputEl.select();
                inputEl.setSelectionRange(0, 99999);
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
            }

            // Animasi umpan balik tombol
            btnEl.innerText = '✅ Tersalin!';
            btnEl.classList.add('copied');
            
            setTimeout(() => {
                btnEl.innerText = originalText;
                btnEl.classList.remove('copied');
            }, 1000);
        }

        // 1. Fungsi Generate + Copy IMEI
        function handleIMEI() {
            let imei = '86';
            for (let i = 0; i < 12; i++) {
                imei += Math.floor(Math.random() * 10);
            }
            
            let sum = 0;
            for (let i = 0; i < 14; i++) {
                let digit = parseInt(imei.charAt(i));
                if (i % 2 !== 0) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
            }
            
            let checkDigit = (10 - (sum % 10)) % 10;
            imei += checkDigit;
            
            document.getElementById('imeiOutput').value = imei;
            copyToClipboard('imeiOutput', 'btnImei', 'Generator IMEI');
        }

        // 2. Fungsi Generate + Copy MAC Address
        function handleMAC() {
            let mac = '';
            const hexChars = '0123456789abcdef';
            for (let i = 0; i < 12; i++) {
                mac += hexChars.charAt(Math.floor(Math.random() * 16));
            }
            
            document.getElementById('macOutput').value = mac;
            copyToClipboard('macOutput', 'btnMac', 'Generator MAC Ad');
        }

        // 3. Fungsi Generate + Copy Serial Number
        function handleSN() {
            let sn = '';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < 15; i++) {
                sn += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            document.getElementById('snOutput').value = sn;
            copyToClipboard('snOutput', 'btnSn', 'Generator SN');
        }
    </script>
</body>
</html>
