<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Data Generator</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            width: 100%; 
            max-width: 450px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            margin-top: 20px; 
        }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 8px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .title { 
            font-size: 18px; 
            font-weight: 600; 
            color: #58a6ff; 
            margin: 0; 
        }
        input { 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #58a6ff; 
            font-size: 20px; 
            text-align: center; 
            font-family: monospace; 
            outline: none; 
            letter-spacing: 1px;
        }
        input:focus { border-color: #58a6ff; }
        button { 
            padding: 12px; 
            background: #238636; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { background: #2ea043; }
        .desc {
            font-size: 12px;
            color: #8b949e;
            text-align: center;
            margin-top: -5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- IMEI Generator -->
        <div class="card">
            <h3 class="title">⚡ Generator IMEI (Luhn Algo)</h3>
            <p class="desc">15 Digit, Awalan 86 (OPPO/BBK)</p>
            <input type="text" id="imeiOutput" placeholder="Klik tombol di bawah" readonly>
            <button onclick="generateIMEI()">Generator IMEI</button>
        </div>

        <!-- MAC Generator -->
        <div class="card">
            <h3 class="title">🌐 Generator MAC Address</h3>
            <p class="desc">12 Karakter Heksadesimal Murni</p>
            <input type="text" id="macOutput" placeholder="Klik tombol di bawah" readonly>
            <button onclick="generateMAC()">Generator MAC Ad</button>
        </div>

        <!-- SN Generator -->
        <div class="card">
            <h3 class="title">🏷️ Generator SN (Serial Number)</h3>
            <p class="desc">15 Karakter Alfanumerik Acak</p>
            <input type="text" id="snOutput" placeholder="Klik tombol di bawah" readonly>
            <button onclick="generateSN()">Generator SN</button>
        </div>
    </div>

    <script>
        // Fungsi 1: Generator IMEI dengan Algoritma Luhn
        function generateIMEI() {
            let imei = '86'; // Awalan TAC untuk China (OPPO dll)
            
            // Tambahkan 12 digit acak (sehingga total 14 digit)
            for (let i = 0; i < 12; i++) {
                imei += Math.floor(Math.random() * 10);
            }
            
            // Hitung digit ke-15 menggunakan Algoritma Luhn
            let sum = 0;
            for (let i = 0; i < 14; i++) {
                let digit = parseInt(imei.charAt(i));
                
                // Kalikan 2 untuk setiap posisi ganjil (indeks 1, 3, 5, ..., 13)
                if (i % 2 !== 0) {
                    digit *= 2;
                    // Jika hasil kali > 9, kurangi 9 (sama dengan menjumlahkan digitnya, misal 18 -> 1+8=9)
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
            }
            
            // Cari check digit (angka yang membuat total kelipatan 10)
            let checkDigit = (10 - (sum % 10)) % 10;
            
            // Gabungkan menjadi 15 digit
            imei += checkDigit;
            
            document.getElementById('imeiOutput').value = imei;
        }

        // Fungsi 2: Generator MAC Address (Heksadesimal)
        function generateMAC() {
            let mac = '';
            const hexChars = '0123456789abcdef';
            
            // Generate 12 karakter
            for (let i = 0; i < 12; i++) {
                mac += hexChars.charAt(Math.floor(Math.random() * 16));
            }
            
            document.getElementById('macOutput').value = mac;
        }

        // Fungsi 3: Generator Serial Number (Alfanumerik)
        function generateSN() {
            let sn = '';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            
            // Generate 15 karakter
            for (let i = 0; i < 15; i++) {
                sn += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            document.getElementById('snOutput').value = sn;
        }
    </script>
</body>
</html>
