<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Data Generator Lengkap (6 Menu)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: transparent; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 4px; 
            margin: 0; 
        }
        .container { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; /* Jarak super rapat untuk 6 menu */
        }
        .card { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 5px; 
            padding: 5px 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { 
            font-size: 11px; 
            font-weight: 600; 
            color: #58a6ff; 
            margin: 0; 
        }
        .badge {
            font-size: 9px;
            color: #8b949e;
            background: #0d1117;
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid #21262d;
        }
        .action-row {
            display: flex;
            gap: 5px;
            width: 100%;
        }
        input { 
            flex: 1;
            width: 100%;
            padding: 5px; 
            border-radius: 4px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #58a6ff; 
            font-size: 12px; 
            text-align: center; 
            font-family: monospace; 
            font-weight: bold;
            outline: none; 
            letter-spacing: 0.5px;
        }
        button { 
            padding: 5px 8px; 
            background: #238636; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap;
            transition: all 0.2s; 
            min-width: 100px;
        }
        button:active { 
            transform: scale(0.97); 
        }
        button.copied {
            background: #1f6feb; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. IMEI Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">⚡ IMEI (Luhn Algo)</span>
                <span class="badge">15 Digit (86)</span>
            </div>
            <div class="action-row">
                <input type="text" id="imeiOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnImei" onclick="handleIMEI()">Gen IMEI</button>
            </div>
        </div>

        <!-- 2. MAC Wi-Fi Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">🌐 Alamat MAC (Wi-Fi)</span>
                <span class="badge">12 Hex Murni</span>
            </div>
            <div class="action-row">
                <input type="text" id="macOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnMac" onclick="handleMAC('macOutput', 'btnMac', 'Gen MAC WiFi')">Gen MAC WiFi</button>
            </div>
        </div>

        <!-- 3. MAC GSM Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">📡 Alamat MAC GSM</span>
                <span class="badge">12 Hex Murni</span>
            </div>
            <div class="action-row">
                <input type="text" id="macGsmOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnMacGsm" onclick="handleMAC('macGsmOutput', 'btnMacGsm', 'Gen MAC GSM')">Gen MAC GSM</button>
            </div>
        </div>

        <!-- 4. MSIN Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">💳 MSIN (ID Kartu SIM)</span>
                <span class="badge">10 Digit Angka</span>
            </div>
            <div class="action-row">
                <input type="text" id="msinOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnMsin" onclick="handleMSIN()">Gen MSIN</button>
            </div>
        </div>

        <!-- 5. Nomor HP Telkomsel Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">📱 Nomor HP (Telkomsel)</span>
                <span class="badge">12 Digit (628xx)</span>
            </div>
            <div class="action-row">
                <input type="text" id="phoneOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnPhone" onclick="handlePhone()">Gen No HP</button>
            </div>
        </div>

        <!-- 6. SN Generator -->
        <div class="card">
            <div class="header-row">
                <span class="title">🏷️ Serial Number (SN)</span>
                <span class="badge">15 Alfanumerik</span>
            </div>
            <div class="action-row">
                <input type="text" id="snOutput" placeholder="Klik tombol 👉" readonly>
                <button id="btnSn" onclick="handleSN()">Gen SN</button>
            </div>
        </div>
    </div>

    <script>
        // Fungsi Salin Otomatis
        function copyToClipboard(inputId, btnId, originalText) {
            const inputEl = document.getElementById(inputId);
            const btnEl = document.getElementById(btnId);
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(inputEl.value);
            } else {
                inputEl.select();
                inputEl.setSelectionRange(0, 99999);
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
            }

            btnEl.innerText = '✅ Tersalin!';
            btnEl.classList.add('copied');
            
            setTimeout(() => {
                btnEl.innerText = originalText;
                btnEl.classList.remove('copied');
            }, 900);
        }

        // 1. Fungsi IMEI
        function handleIMEI() {
            let imei = '86';
            for (let i = 0; i < 12; i++) {
                imei += Math.floor(Math.random() * 10);
            }
            let sum = 0;
            for (let i = 0; i < 14; i++) {
                let digit = parseInt(imei.charAt(i));
                if (i % 2 !== 0) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
            }
            let checkDigit = (10 - (sum % 10)) % 10;
            imei += checkDigit;
            
            document.getElementById('imeiOutput').value = imei;
            copyToClipboard('imeiOutput', 'btnImei', 'Gen IMEI');
        }

        // 2 & 3. Fungsi MAC Address (Wi-Fi & GSM)
        function handleMAC(inputId, btnId, btnText) {
            let mac = '';
            const hexChars = '0123456789abcdef';
            for (let i = 0; i < 12; i++) {
                mac += hexChars.charAt(Math.floor(Math.random() * 16));
            }
            
            document.getElementById(inputId).value = mac;
            copyToClipboard(inputId, btnId, btnText);
        }

        // 4. Fungsi MSIN (10 Digit)
        function handleMSIN() {
            let msin = '' + (Math.floor(Math.random() * 9) + 1);
            for (let i = 0; i < 9; i++) {
                msin += Math.floor(Math.random() * 10);
            }
            
            document.getElementById('msinOutput').value = msin;
            copyToClipboard('msinOutput', 'btnMsin', 'Gen MSIN');
        }

        // 5. Fungsi Nomor HP Telkomsel (12 Digit, Awalan 62)
        function handlePhone() {
            // Daftar prefix resmi Telkomsel (5 digit awal)
            const prefixes = ['62811', '62812', '62813', '62821', '62822', '62823', '62852', '62853'];
            // Pilih salah satu prefix secara acak
            let phone = prefixes[Math.floor(Math.random() * prefixes.length)];
            
            // Tambahkan 7 digit angka acak (5 + 7 = 12 digit total)
            for (let i = 0; i < 7; i++) {
                phone += Math.floor(Math.random() * 10);
            }
            
            document.getElementById('phoneOutput').value = phone;
            copyToClipboard('phoneOutput', 'btnPhone', 'Gen No HP');
        }

        // 6. Fungsi Serial Number
        function handleSN() {
            let sn = '';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < 15; i++) {
                sn += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            document.getElementById('snOutput').value = sn;
            copyToClipboard('snOutput', 'btnSn', 'Gen SN');
        }
    </script>
</body>
</html>
