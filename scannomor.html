<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; 
            background: transparent; color: #fff; text-align: center; overflow: hidden;
        }
        
        .kamera-container { 
            position: relative; width: 100%; max-width: 350px; 
            height: 80px; /* Dibuat pipih sesuai skrip baru */
            margin: 10px auto; border: 4px solid #00ff00; border-radius: 12px; overflow: hidden; 
            background-color: #000; box-shadow: 0 5px 15px rgba(0,255,0,0.15); 
        }
        .kamera-container video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Garis bidik merah di tengah scanner */
        .garis-bidik {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(255, 0, 0, 0.7);
            box-shadow: 0 0 8px red;
            transform: translateY(-50%);
            z-index: 10;
        }

        .btn-scanner { padding: 12px 15px; font-size: 15px; margin: 5px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.3); transition: all 0.3s; }
        .btn-scan-biru { background-color: #007bff; color: white; }
        .btn-scan-biru:hover { background-color: #0056b3; }
        .btn-scan-kuning { background-color: #f0ad4e; color: white; }
        .btn-scan-kuning:hover { background-color: #ec971f; }
        .btn-scanner:disabled { background-color: #2c2547 !important; cursor: not-allowed; color: #6e678a; box-shadow: none; }
        
        #hasil-scan-input { width: 90%; max-width: 350px; height: 45px; font-size: 22px; font-weight: bold; margin: 15px 0; padding: 10px; text-align: center; letter-spacing: 2px; border: 2px solid #3d3463; border-radius: 8px; background-color: #1a1535; color: #00ffcc; outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        #status-scanner { color: #aaa; font-weight: bold; margin-bottom: 5px; min-height: 20px; font-size: 13px; }
    </style>
</head>
<body>
    <p style="color: #aaa; font-size: 13px; margin-top: 5px; margin-bottom: 5px;">Paskan nomor tepat di <b>garis merah</b>.</p>
    
    <div class="kamera-container">
        <video id="kamera" autoplay playsinline></video>
        <div class="garis-bidik" id="garis-bidik"></div>
    </div>
    
    <div id="status-scanner">Menyalakan kamera...</div>
    <canvas id="canvasScanner" style="display:none;"></canvas>
    
    <div>
        <button id="btn-scan" class="btn-scanner btn-scan-biru">📸 Ambil & Scan</button>
        <button id="btn-ulangi" class="btn-scanner btn-scan-kuning" style="display:none;">🔄 Ulangi</button>
    </div>
    
    <input type="text" id="hasil-scan-input" placeholder="Hasil scan di sini..." readonly>
    <br>
    <button id="btn-copy-scanner" class="btn-scanner btn-scan-biru" disabled>📋 Salin Nomor</button>

    <script>
        const video = document.getElementById('kamera');
        const canvasScanner = document.getElementById('canvasScanner');
        const ctxScanner = canvasScanner.getContext('2d');
        const btnScan = document.getElementById('btn-scan');
        const btnUlangi = document.getElementById('btn-ulangi');
        const btnCopyScanner = document.getElementById('btn-copy-scanner');
        const hasilScanInput = document.getElementById('hasil-scan-input');
        const statusScanner = document.getElementById('status-scanner');
        const garisBidik = document.getElementById('garis-bidik');
        let scannerStream = null;

        function startScannerCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: "continuous" }] } })
            .then(stream => {
                scannerStream = stream; 
                video.srcObject = stream;
                video.onloadedmetadata = () => { statusScanner.innerText = "Siap digunakan."; statusScanner.style.color = "#00ffcc"; };
            }).catch(err => {
                statusScanner.innerText = "Error: Akses kamera ditolak/tidak tersedia."; statusScanner.style.color = "#ff4a4a";
            });
        }

        // Otomatis nyalakan kamera saat iframe dimuat
        startScannerCamera();

        btnScan.addEventListener('click', () => {
            if(!scannerStream) return;
            video.pause(); 
            garisBidik.style.display = "none"; // Sembunyikan garis bidik
            
            btnScan.style.display = "none"; 
            btnUlangi.style.display = "inline-block"; 
            btnCopyScanner.disabled = true; 
            hasilScanInput.value = "";
            
            statusScanner.innerText = "Mengekstrak nomor pintar..."; 
            statusScanner.style.color = "#f0ad4e";
            
            const vWidth = video.videoWidth; 
            const vHeight = video.videoHeight; 
            // Rasio diubah menyesuaikan kotak yang lebih pipih (350x80)
            const targetRatio = 350 / 80; 
            const videoRatio = vWidth / vHeight;
            
            let cropW, cropH;
            if (videoRatio > targetRatio) { 
                cropH = vHeight; 
                cropW = vHeight * targetRatio; 
            } else { 
                cropW = vWidth; 
                cropH = vWidth / targetRatio; 
            }
            
            const cropX = ((vWidth - cropW) / 2); 
            const cropY = ((vHeight - cropH) / 2);
            
            canvasScanner.width = cropW; 
            canvasScanner.height = cropH;
            
            ctxScanner.filter = 'grayscale(100%) contrast(250%) brightness(110%)';
            ctxScanner.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            const imageData = canvasScanner.toDataURL('image/jpeg', 0.9);

            Tesseract.recognize(imageData, 'eng').then(({ data: { text } }) => {
                
                // LOGIKA PINTAR BARU DARI SKRIP ANDA:
                // Cari deretan angka (boleh ada spasi/strip) minimal 6 digit
                const regexDeretanAngka = /(?:\d[ \-]*){6,}/g;
                const temuan = text.match(regexDeretanAngka);

                if (temuan && temuan.length > 0) {
                    // Pilih deretan angka yang paling panjang (mengabaikan teks acak lain)
                    let angkaTerpanjang = temuan.reduce((a, b) => a.length > b.length ? a : b);
                    // Bersihkan dari spasi/strip sehingga murni angka
                    const hasilBersih = angkaTerpanjang.replace(/[^0-9]/g, '');

                    hasilScanInput.value = hasilBersih; 
                    statusScanner.innerText = "Berhasil! Teks acak diabaikan.";
                    statusScanner.style.color = "#00ffcc"; 
                    btnCopyScanner.disabled = false;
                } else {
                    statusScanner.innerText = "Nomor tidak terdeteksi. Silakan ulangi."; 
                    statusScanner.style.color = "#ff4a4a";
                }
            }).catch(err => { 
                statusScanner.innerText = "Gagal memindai gambar."; 
                statusScanner.style.color = "#ff4a4a"; 
            });
        });

        btnUlangi.addEventListener('click', () => {
            video.play(); 
            garisBidik.style.display = "block"; // Tampilkan kembali garis bidik
            btnScan.style.display = "inline-block"; 
            btnUlangi.style.display = "none"; 
            btnCopyScanner.disabled = true; 
            hasilScanInput.value = "";
            statusScanner.innerText = "Siap digunakan."; 
            statusScanner.style.color = "#00ffcc";
        });

        btnCopyScanner.addEventListener('click', () => { 
            if (navigator.clipboard && window.isSecureContext) { 
                navigator.clipboard.writeText(hasilScanInput.value);
            } else {
                const textArea = document.createElement("textarea"); textArea.value = hasilScanInput.value;
                textArea.style.position = "fixed"; textArea.style.left = "-999999px"; document.body.appendChild(textArea); textArea.focus(); textArea.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(textArea);
            }
            
            // Menyambungkan tombol salin dengan notifikasi panel utama
            if(window.parent && window.parent.showToast) {
                window.parent.showToast("Nomor Hasil Scan Disalin! ✨");
            }
        });
    </script>
</body>
</html>
