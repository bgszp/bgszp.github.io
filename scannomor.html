<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner & Penyalin Nomor</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; margin: 0; }
        
        .kamera-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            height: 80px; /* Dibuat lebih pipih agar teks lain tidak masuk */
            margin: 20px auto;
            border: 4px solid #00ff00; 
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Garis bidik merah di tengah scanner */
        .garis-bidik {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(255, 0, 0, 0.7);
            box-shadow: 0 0 8px red;
            transform: translateY(-50%);
            z-index: 10;
        }

        button { padding: 12px 15px; font-size: 15px; margin: 5px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; }
        .btn-biru { background-color: #007bff; color: white; }
        .btn-biru:hover { background-color: #0056b3; }
        .btn-kuning { background-color: #f0ad4e; color: white; }
        .btn-kuning:hover { background-color: #ec971f; }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; color: #666; }
        
        #hasil-scan { width: 90%; max-width: 350px; height: 45px; font-size: 22px; font-weight: bold; margin: 15px 0; padding: 10px; text-align: center; letter-spacing: 2px; border: 2px solid #ccc; border-radius: 8px; }
        #status { color: #555; font-weight: bold; margin-bottom: 10px; min-height: 20px; }
    </style>
</head>
<body>

    <h2>Scanner Nomor 📷</h2>
    <p style="color: #666; font-size: 14px;">Paskan nomor tepat di <b>garis merah</b>.</p>

    <div class="kamera-container">
        <video id="kamera" autoplay playsinline></video>
        <div class="garis-bidik" id="garis-bidik"></div>
    </div>
    
    <div id="status">Menyalakan kamera...</div>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div>
        <button id="btn-scan" class="btn-biru">📸 Ambil & Scan</button>
        <button id="btn-ulangi" class="btn-kuning" style="display:none;">🔄 Ulangi</button>
    </div>
    
    <input type="text" id="hasil-scan" placeholder="Hasil di sini..." readonly>
    <br>
    <button id="btn-copy" class="btn-biru" disabled>📋 Salin Nomor</button>

    <script>
        const video = document.getElementById('kamera');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnScan = document.getElementById('btn-scan');
        const btnUlangi = document.getElementById('btn-ulangi');
        const btnCopy = document.getElementById('btn-copy');
        const hasilScan = document.getElementById('hasil-scan');
        const statusTeks = document.getElementById('status');
        const garisBidik = document.getElementById('garis-bidik');

        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: "continuous" }] } 
        }).then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => { statusTeks.innerText = "Siap digunakan."; };
        }).catch(err => {
            statusTeks.innerText = "Error: Kamera tidak dapat diakses.";
        });

        btnScan.addEventListener('click', () => {
            video.pause(); 
            garisBidik.style.display = "none"; // Sembunyikan garis saat foto diambil
            
            btnScan.style.display = "none";
            btnUlangi.style.display = "inline-block";
            btnCopy.disabled = true;
            hasilScan.value = "";
            statusTeks.innerText = "Mengekstrak nomor pintar...";
            statusTeks.style.color = "#f0ad4e";

            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            // Rasio diubah menyesuaikan kotak yang lebih pipih (350x80)
            const targetRatio = 350 / 80;
            const videoRatio = vWidth / vHeight;
            
            let cropW, cropH;
            if (videoRatio > targetRatio) {
                cropH = vHeight;
                cropW = vHeight * targetRatio;
            } else {
                cropW = vWidth;
                cropH = vWidth / targetRatio;
            }
            
            const cropX = ((vWidth - cropW) / 2);
            const cropY = ((vHeight - cropH) / 2);

            canvas.width = cropW;
            canvas.height = cropH;
            
            ctx.filter = 'grayscale(100%) contrast(250%) brightness(110%)';
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.9);

            Tesseract.recognize(imageData, 'eng')
            .then(({ data: { text } }) => {
                // LOGIKA PINTAR BARU:
                // Cari deretan angka (boleh ada spasi/strip) minimal 6 digit
                const regexDeretanAngka = /(?:\d[ \-]*){6,}/g;
                const temuan = text.match(regexDeretanAngka);

                if (temuan && temuan.length > 0) {
                    // Jika menemukan kumpulan angka, pilih deretan yang paling panjang
                    // (Nomor rekening/VA pasti yang paling panjang dibanding teks acak)
                    let angkaTerpanjang = temuan.reduce((a, b) => a.length > b.length ? a : b);
                    
                    // Hilangkan spasinya
                    const hasilBersih = angkaTerpanjang.replace(/[^0-9]/g, '');

                    hasilScan.value = hasilBersih;
                    statusTeks.innerText = "Berhasil! Teks acak diabaikan.";
                    statusTeks.style.color = "#5cb85c";
                    btnCopy.disabled = false;
                } else {
                    statusTeks.innerText = "Nomor tidak terdeteksi. Silakan ulangi.";
                    statusTeks.style.color = "#d9534f";
                }
            }).catch(err => {
                statusTeks.innerText = "Gagal memindai.";
                statusTeks.style.color = "#d9534f";
            });
        });

        btnUlangi.addEventListener('click', () => {
            video.play();
            garisBidik.style.display = "block";
            btnScan.style.display = "inline-block";
            btnUlangi.style.display = "none";
            btnCopy.disabled = true;
            hasilScan.value = "";
            statusTeks.innerText = "Siap digunakan.";
            statusTeks.style.color = "#555";
        });

        btnCopy.addEventListener('click', () => {
            hasilScan.select();
            hasilScan.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(hasilScan.value).then(() => {
                alert("Berhasil disalin: " + hasilScan.value);
            });
        });
    </script>
</body>
</html>
